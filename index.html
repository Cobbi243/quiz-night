<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Night — Своя Гра</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,900&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="config.js"></script>
<style>
:root {
  --bg: #0f0e17; --bg-2: #1a1825; --ink: #faf6ef;
  --ink-dim: rgba(250, 246, 239, 0.6); --ink-faint: rgba(250, 246, 239, 0.3);
  --accent: #e84a30; --accent-dark: #c93a23;
  --gold: #f0b429; --gold-dark: #c8941f;
  --green: #4ade80; --red: #ef4444;
  --line: rgba(250, 246, 239, 0.12);
  --soft: rgba(250, 246, 239, 0.06); --soft-hover: rgba(250, 246, 239, 0.1);
  --stage: linear-gradient(180deg, #1a1825 0%, #0f0e17 100%);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  background-image:
    radial-gradient(1200px 600px at 85% -5%, rgba(240,180,41,0.06), transparent 60%),
    radial-gradient(900px 500px at 10% 105%, rgba(232,74,48,0.05), transparent 55%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  min-height: 100vh; -webkit-font-smoothing: antialiased;
}
.grain {
  position: fixed; inset: 0; pointer-events: none; opacity: 0.06; z-index: 0;
  background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
#app { position: relative; z-index: 1; min-height: 100vh; padding: 24px; }

@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.slide-up { animation: slideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.spin { animation: spin 1s linear infinite; display: inline-block; }

.container { max-width: 720px; margin: 0 auto; }
.container-sm { max-width: 460px; margin: 0 auto; }
.container-lg { max-width: 1100px; margin: 0 auto; }
.center-screen { min-height: calc(100vh - 48px); display: flex; flex-direction: column; align-items: center; justify-content: center; }

.btn {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-weight: 500; padding: 12px 24px; font-size: 16px;
  border: none; border-radius: 12px; cursor: pointer;
  transition: all 0.15s ease; display: inline-flex; align-items: center;
  justify-content: center; gap: 8px;
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--ink); color: var(--bg); }
.btn-primary:hover:not(:disabled) { background: var(--gold); }
.btn-accent { background: var(--accent); color: var(--ink); }
.btn-accent:hover:not(:disabled) { background: var(--accent-dark); }
.btn-gold { background: var(--gold); color: var(--bg); }
.btn-gold:hover:not(:disabled) { background: var(--gold-dark); }
.btn-green { background: var(--green); color: var(--bg); }
.btn-green:hover:not(:disabled) { background: #22c55e; }
.btn-red { background: var(--red); color: var(--ink); }
.btn-red:hover:not(:disabled) { background: #dc2626; }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn-ghost:hover:not(:disabled) { background: var(--soft); }
.btn-lg { padding: 16px 32px; font-size: 18px; }
.btn-sm { padding: 8px 16px; font-size: 14px; }
.btn-full { width: 100%; }

.card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }

.input {
  width: 100%; background: transparent; border: none;
  border-bottom: 1px solid var(--line); padding: 12px 0;
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-size: 18px; color: var(--ink); outline: none;
  transition: border-color 0.15s;
}
.input:focus { border-bottom-color: var(--accent); }
.input::placeholder { color: var(--ink-faint); }
.input-code {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 64px; font-weight: 700;
  letter-spacing: 0.3em; text-align: center; text-transform: uppercase;
}

.back-btn {
  background: transparent; border: none; cursor: pointer;
  color: var(--ink-dim); font-family: inherit; font-size: 14px;
  display: inline-flex; align-items: center; gap: 4px; padding: 4px;
  margin-bottom: 32px;
}
.back-btn:hover { color: var(--ink); }

.avatar-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-top: 8px; }
.avatar-btn {
  background: var(--soft); border: none; cursor: pointer;
  font-size: 22px; padding: 8px; border-radius: 10px;
  transition: all 0.15s;
}
.avatar-btn:hover { background: var(--soft-hover); }
.avatar-btn.active { background: var(--gold); transform: scale(1.1); }

.eyebrow {
  color: var(--gold); font-size: 12px; letter-spacing: 0.3em;
  margin-bottom: 12px; text-transform: uppercase; font-weight: 700;
}
.hero-title {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 900; font-size: clamp(56px, 11vw, 112px);
  line-height: 0.85; text-align: center;
}
.hero-title em { font-style: italic; color: var(--accent); }
.hero-sub {
  color: var(--ink-dim); margin-top: 24px;
  max-width: 440px; text-align: center;
  font-size: 15px; line-height: 1.5;
}

.options-row { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 480px; }
@media (min-width: 540px) { .options-row { flex-direction: row; } }

.code-display { text-align: right; }
.code-label {
  font-size: 11px; color: var(--ink-dim);
  letter-spacing: 0.15em; margin-bottom: 4px; text-transform: uppercase;
}
.code-value {
  background: none; border: none; cursor: pointer;
  font-family: 'Fraunces', Georgia, serif;
  font-size: 36px; font-weight: 700; color: var(--gold);
  letter-spacing: 0.2em; display: flex; align-items: center; gap: 8px; padding: 0;
}
.code-value:hover { color: var(--accent); }

.players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.player-card { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--soft); position: relative; }
.kick-btn {
  margin-left: auto; flex-shrink: 0;
  background: transparent; border: 1px solid var(--line);
  color: var(--ink-faint); cursor: pointer;
  width: 28px; height: 28px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.kick-btn:hover { background: rgba(232,74,48,0.15); border-color: var(--accent); color: var(--accent); }
.player-card.me { background: rgba(232, 74, 48, 0.15); border: 1px solid rgba(232, 74, 48, 0.4); }
.player-avatar { font-size: 24px; }
.player-name { font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 4px; min-width: 0; }
.name-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.host-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(240, 180, 41, 0.2); color: var(--gold);
  padding: 4px 12px; border-radius: 999px;
  font-size: 11px; letter-spacing: 0.1em;
  text-transform: uppercase; margin-bottom: 16px; font-weight: 700;
}

.source-card {
  display: flex; align-items: center; gap: 16px;
  padding: 20px; border-radius: 16px;
  background: var(--soft); border: none;
  cursor: pointer; transition: background 0.15s;
  font-family: inherit; color: var(--ink); width: 100%; text-align: left;
}
.source-card:hover { background: var(--soft-hover); }
.source-icon {
  width: 48px; height: 48px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.source-icon.gold { background: var(--gold); color: var(--bg); }
.source-icon.red { background: var(--accent); color: var(--ink); }
.source-icon.green { background: var(--green); color: var(--bg); }
.source-icon.blue { background: #5b9bd5; color: var(--bg); }
.source-icon.purple { background: #9b59b6; color: var(--ink); }
.source-title { font-weight: 700; font-size: 16px; }
.source-sub { font-size: 13px; color: var(--ink-dim); margin-top: 2px; }

.err-text { color: var(--accent); font-size: 14px; margin-top: 16px; }
.info-text { color: var(--ink-dim); font-size: 14px; margin-top: 16px; }

/* JEOPARDY BOARD */
.board-wrap { background: var(--stage); border-radius: 24px; padding: 20px; box-shadow: 0 24px 48px rgba(0,0,0,0.4); }
.board { display: grid; gap: 8px; grid-template-columns: repeat(6, 1fr); grid-template-rows: auto repeat(5, minmax(80px, 1fr)); }
.board-header {
  background: linear-gradient(180deg, #2a253d 0%, #1d1a2c 100%);
  border-radius: 12px; padding: 12px 8px;
  display: flex; align-items: center; justify-content: center;
  text-align: center; min-height: 64px;
  border: 1px solid rgba(240,180,41,0.12);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
}
.board-header .cat-name {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 700; font-size: clamp(10px, 1.2vw, 14px);
  text-transform: uppercase; letter-spacing: 0.03em;
  color: var(--gold); line-height: 1.1;
}
.board-cell {
  position: relative;
  background: linear-gradient(180deg, #211d31 0%, #14121d 100%);
  border-radius: 12px; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.05);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 900; font-size: clamp(20px, 2.6vw, 36px);
  color: var(--gold);
  transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.14s ease, border-color 0.14s ease;
  padding: 8px;
  text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 2px 6px rgba(0,0,0,0.25);
}
.board-cell:hover:not(:disabled) {
  background: linear-gradient(180deg, #322b47 0%, #201c30 100%);
  color: #fff8e6;
  border-color: rgba(240,180,41,0.55);
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 0 0 1px rgba(240,180,41,0.25), 0 8px 20px rgba(240,180,41,0.12), 0 6px 16px rgba(0,0,0,0.4);
  z-index: 1;
}
.board-cell:active:not(:disabled) { transform: translateY(0) scale(0.99); }
.board-cell.used {
  background: rgba(255,255,255,0.015);
  color: transparent; cursor: default;
  border-color: rgba(255,255,255,0.04);
  box-shadow: none;
}
.board-cell:disabled { cursor: not-allowed; }
.cell-img-icon {
  position: absolute; top: 6px; right: 6px;
  color: var(--gold); opacity: 0.45;
  display: flex; align-items: center; gap: 3px;
  pointer-events: none;
  /* Emoji markers inherit the cell's huge font size otherwise */
  font-size: 12px; line-height: 1;
  text-shadow: none;
}

.player-bar { display: flex; gap: 12px; margin-top: 24px; overflow-x: auto; padding-bottom: 8px; }
.player-chip {
  background: var(--bg-2); border-radius: 14px;
  padding: 12px 16px; min-width: 140px; flex-shrink: 0;
  border: 2px solid var(--line); transition: all 0.2s;
}
.player-chip.current-picker { border-color: var(--gold); box-shadow: 0 0 20px rgba(240,180,41,0.3); }
.player-chip.me { border-color: var(--accent); }
.player-chip-top { display: flex; align-items: center; gap: 8px; }
.player-chip-name { font-weight: 600; font-size: 13px; flex: 1; min-width: 0; }
.player-chip-score {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 900; font-size: 24px;
  color: var(--gold); margin-top: 4px;
}
.player-chip-score.negative { color: var(--accent); }

.picker-banner { text-align: center; margin-bottom: 16px; font-size: 14px; color: var(--ink-dim); }
.picker-banner b { color: var(--gold); }

/* QUESTION VIEW */
.q-stage {
  background: var(--stage); border-radius: 24px;
  padding: 40px 24px; min-height: 60vh;
  display: flex; flex-direction: column;
  box-shadow: 0 24px 48px rgba(0,0,0,0.4);
}

/* ===== Fixed-height question screen (no page scroll; sticky controls) ===== */
.question-screen {
  max-width: 1100px; margin: 0 auto;
  height: calc(100vh - 24px);
  height: calc(100dvh - 24px);
  display: flex; flex-direction: column;
  gap: 12px;
  padding: 12px 0;
}
.qs-topbar {
  flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center;
}
.qs-stage {
  flex: 1 1 auto; min-height: 0;               /* allow shrink so it never pushes controls off */
  background: var(--stage); border-radius: 24px;
  box-shadow: 0 24px 48px rgba(0,0,0,0.4);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.qs-stage-header {
  flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 24px 12px; font-size: 14px;
}
.qs-stage-body {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto;                             /* only the question text scrolls, if ever needed */
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  text-align: center;
  padding: 8px 24px 24px;
}
/* Auto margins centre the content when it fits, but never clip the top when it
   overflows (which plain `justify-content:center` does). */
.qs-body-inner {
  margin: auto 0; width: 100%;
  display: flex; flex-direction: column;
  align-items: center; gap: 16px;
}
/* Auto-sizing question text: scales with viewport, smaller floor so long text fits */
.qs-question-text {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 700; line-height: 1.15;
  max-width: 900px; white-space: pre-wrap;
  font-size: clamp(20px, 3.2vw, 42px);
}
/* Length-based shrink: long questions get a smaller clamp via a modifier */
.qs-question-text.long   { font-size: clamp(18px, 2.6vw, 32px); }
.qs-question-text.xlong  { font-size: clamp(16px, 2.1vw, 26px); line-height: 1.25; }
.qs-controls {
  flex-shrink: 0;                               /* pinned to the bottom, always visible */
  display: flex; flex-direction: column; gap: 10px;
}

.q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; font-size: 14px; }
.q-cat { text-transform: uppercase; letter-spacing: 0.15em; color: var(--gold); font-weight: 700; }
.q-value { font-family: 'Fraunces', Georgia, serif; font-weight: 900; font-size: 32px; color: var(--gold); }
.q-text { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px 0; flex-direction: column; gap: 16px; }
.q-image { max-width: 100%; max-height: 60vh; border-radius: 12px; object-fit: contain; }
.q-text-inner {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 700; font-size: clamp(24px, 4vw, 44px);
  line-height: 1.2; max-width: 900px;
  white-space: pre-wrap;
}
.q-answer-reveal {
  margin-top: 24px; padding: 16px;
  background: rgba(74, 222, 128, 0.1);
  border: 1px solid rgba(74, 222, 128, 0.3);
  border-radius: 12px; text-align: center; color: var(--green);
}
.q-answer-reveal-label { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; margin-bottom: 4px; }
.q-answer-reveal-text { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; white-space: pre-wrap; }

.buzz-btn {
  background: var(--accent); color: var(--ink);
  border: none; border-radius: 100px;
  padding: 24px 48px; cursor: pointer;
  font-family: inherit; font-weight: 700; font-size: 22px;
  width: 100%; max-width: 360px; margin: 0 auto;
  display: block; transition: all 0.15s;
  box-shadow: 0 12px 32px rgba(232,74,48,0.4);
  animation: buzzPulse 1.8s ease-in-out infinite;
}
@keyframes buzzPulse {
  0%, 100% { box-shadow: 0 12px 32px rgba(232,74,48,0.35); }
  50% { box-shadow: 0 12px 40px rgba(232,74,48,0.6); }
}
.buzz-btn:hover:not(:disabled) {
  background: var(--accent-dark); transform: translateY(-2px);
  box-shadow: 0 16px 40px rgba(232,74,48,0.5);
  animation: none;
}
.buzz-btn:active:not(:disabled) { transform: scale(0.97); }
.buzz-btn:disabled { background: var(--soft); cursor: not-allowed; box-shadow: none; opacity: 0.5; animation: none; }
.buzz-btn.cooldown { animation: buzzShake 0.4s ease; background: var(--soft); }
@keyframes buzzShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}

.buzzed-banner { background: var(--gold); color: var(--bg); border-radius: 16px; padding: 20px 24px; text-align: center; }
.buzzed-banner-label { font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
.buzzed-banner-name { font-family: 'Fraunces', Georgia, serif; font-weight: 900; font-size: 32px; }

.host-controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
.host-controls .btn { flex: 1; min-width: 140px; }
.attempted-list { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
.attempted-chip { background: var(--soft); padding: 4px 10px; border-radius: 999px; font-size: 12px; color: var(--ink-dim); text-decoration: line-through; }

/* SETUP */
.cat-input-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.cat-input-row .num { font-family: 'Fraunces', Georgia, serif; font-weight: 700; color: var(--gold); width: 24px; text-align: center; }
.cat-input-row input { flex: 1; }

.q-builder-card { background: var(--soft); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.q-builder-question { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.q-builder-question .value-pill {
  background: var(--gold); color: var(--bg);
  border-radius: 6px; padding: 4px 8px;
  font-family: 'Fraunces', Georgia, serif; font-weight: 700;
  font-size: 12px; flex-shrink: 0; min-width: 36px; text-align: center;
}
.q-builder-question .q-text-input, .q-builder-question .a-text-input {
  flex: 1; background: transparent; border: none;
  border-bottom: 1px solid var(--line);
  padding: 6px 0; color: var(--ink); outline: none;
  font-family: inherit; font-size: 14px;
}
.q-builder-question .q-text-input:focus, .q-builder-question .a-text-input:focus { border-bottom-color: var(--accent); }
.q-builder-question .a-text-input { color: var(--green); }

.q-image-row { display: flex; align-items: center; gap: 8px; margin-left: 46px; margin-top: 4px; font-size: 12px; }
.q-image-btn { background: var(--soft); border: 1px dashed var(--line); padding: 6px 10px; border-radius: 8px; color: var(--ink-dim); cursor: pointer; font-family: inherit; font-size: 12px; }
.q-image-btn:hover { background: var(--soft-hover); color: var(--ink); }
.q-image-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
.q-image-clear { background: transparent; border: none; color: var(--accent); cursor: pointer; padding: 4px; }

/* FILE UPLOAD */
.dropzone {
  border: 2px dashed var(--line); border-radius: 16px;
  padding: 40px 24px; text-align: center; cursor: pointer;
  transition: all 0.15s; background: var(--soft);
}
.dropzone:hover, .dropzone.drag { border-color: var(--gold); background: rgba(240,180,41,0.05); }
.dropzone-title { font-weight: 700; font-size: 16px; margin-top: 12px; }
.dropzone-sub { color: var(--ink-dim); font-size: 13px; margin-top: 4px; }

.parsed-preview { max-height: 360px; overflow-y: auto; }
.parsed-cat { margin-bottom: 16px; }
.parsed-cat-name { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 18px; color: var(--gold); margin-bottom: 8px; }
.parsed-q { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.parsed-q .v { color: var(--gold); font-weight: 700; }
.parsed-q .a { color: var(--green); font-size: 12px; margin-top: 2px; }

/* SAVED PACKS */
.saved-pack {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-radius: 12px;
  background: var(--soft); margin-bottom: 8px;
  cursor: pointer; transition: background 0.15s;
}
.saved-pack:hover { background: var(--soft-hover); }
.saved-pack-info { flex: 1; min-width: 0; }
.saved-pack-name { font-weight: 600; font-size: 15px; }
.saved-pack-meta { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
.saved-pack-actions { display: flex; gap: 4px; }
.icon-btn { background: transparent; border: none; color: var(--ink-dim); cursor: pointer; padding: 8px; border-radius: 8px; }
.icon-btn:hover { background: var(--soft-hover); color: var(--ink); }
.icon-btn.danger:hover { color: var(--accent); }

/* RESULTS */
.winner-card {
  display: inline-flex; flex-direction: column; align-items: center;
  background: var(--gold); color: var(--bg);
  border-radius: 24px; padding: 32px 48px;
}
.winner-emoji { font-size: 72px; margin-bottom: 8px; }
.winner-name { font-family: 'Fraunces', Georgia, serif; font-size: 40px; font-weight: 900; }
.winner-score { font-size: 14px; opacity: 0.7; margin-top: 4px; font-weight: 700; }
.final-row { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; background: var(--soft); margin-bottom: 8px; }
.final-row.first { background: rgba(240, 180, 41, 0.15); border: 1px solid rgba(240,180,41,0.4); }
.final-row .rank { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; color: var(--ink-faint); width: 32px; }
.final-row .name { flex: 1; font-weight: 500; }
.final-row .pts { font-family: 'Fraunces', Georgia, serif; font-weight: 900; font-size: 22px; color: var(--gold); }
.final-row .pts.negative { color: var(--accent); }

/* SETUP WARNING */
.setup-warning {
  background: rgba(232,74,48,0.1); border: 1px solid rgba(232,74,48,0.4);
  border-radius: 12px; padding: 16px; margin-bottom: 24px;
  color: var(--ink); font-size: 13px; line-height: 1.5;
}
.setup-warning b { color: var(--accent); }
.setup-warning code { background: var(--soft); padding: 1px 6px; border-radius: 4px; font-size: 12px; }

/* FORMAT HINT */
.format-hint {
  background: var(--soft); border-radius: 10px;
  padding: 12px 16px; font-size: 12px;
  color: var(--ink-dim); margin-top: 12px;
  font-family: ui-monospace, 'Cascadia Code', monospace;
  white-space: pre-wrap; line-height: 1.5;
}

/* HOST: clickable score chip */
.player-chip.editable { cursor: pointer; }
.player-chip.editable:hover { background: var(--soft-hover); }
.player-chip.editable .player-chip-score { position: relative; }
.player-chip.editable .player-chip-score::after {
  content: '✏';
  position: absolute; top: -4px; right: -8px;
  font-size: 11px; opacity: 0; transition: opacity 0.15s;
}
.player-chip.editable:hover .player-chip-score::after { opacity: 0.6; }

/* SCORE EDIT MODAL */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  z-index: 100; display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.modal {
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 20px; padding: 24px;
  max-width: 420px; width: 100%;
  animation: slideUp 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.modal-title {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 700; font-size: 22px; margin-bottom: 4px;
}
.modal-subtitle {
  font-size: 13px; color: var(--ink-dim); margin-bottom: 20px;
}
.modal-score {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 900; font-size: 56px;
  color: var(--gold); text-align: center;
  margin: 16px 0;
}
.modal-score.negative { color: var(--accent); }
.score-buttons {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 8px; margin-bottom: 12px;
}
.score-btn {
  background: var(--soft); color: var(--ink);
  border: none; border-radius: 10px; padding: 12px 4px;
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-weight: 700; font-size: 14px;
  cursor: pointer; transition: all 0.15s;
}
.score-btn:hover { background: var(--soft-hover); transform: translateY(-1px); }
.score-btn.minus { color: var(--accent); }
.score-btn.plus { color: var(--green); }
.modal-actions {
  display: flex; gap: 8px; margin-top: 20px;
}
.modal-actions .btn { flex: 1; }

/* TIMER BAR */
.timer-bar {
  margin-bottom: 16px;
  background: var(--soft);
  border-radius: 12px;
  padding: 10px 16px;
}
.timer-bar-label {
  font-size: 13px;
  color: var(--ink-dim);
  margin-bottom: 6px;
  text-align: center;
}
.timer-bar-label b { color: var(--ink); font-size: 16px; font-family: 'Fraunces', Georgia, serif; }
.timer-bar-track {
  height: 6px;
  background: rgba(250, 246, 239, 0.08);
  border-radius: 3px;
  overflow: hidden;
}
.timer-bar-fill {
  height: 100%;
  transition: width 0.25s linear;
  border-radius: 3px;
}
/* TIMER CHIP PICKER */
.timer-chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.timer-chip {
  background: var(--soft); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 16px; font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-weight: 600; font-size: 14px; cursor: pointer;
  transition: all 0.15s; min-width: 56px;
}
.timer-chip:hover { background: var(--soft-hover); }
.timer-chip.active {
  background: var(--gold); color: var(--bg); border-color: var(--gold);
}

/* Prevent accidental text selection in interactive game areas */
.q-stage, .buzz-btn, .buzzed-banner, .player-bar, .board, .host-controls, .timer-bar {
  -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
}

/* Player bar: wrap into a grid so many players don't cause horizontal scroll */
.player-bar {
  display: grid !important;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px;
  margin-top: 24px;
  overflow: visible !important;
  padding-bottom: 0 !important;
}
.player-chip {
  min-width: 0 !important;
  flex-shrink: 1 !important;
}
.player-chip-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* CHAT WIDGET */
.chat-fab {
  position: fixed; bottom: 20px; right: 20px; z-index: 95;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--gold); color: var(--bg);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  transition: transform 0.15s;
}
.chat-fab:hover { transform: scale(1.08); }
.chat-fab-badge {
  position: absolute; top: -2px; right: -2px;
  background: var(--accent); color: #fff;
  font-size: 11px; font-weight: 700;
  min-width: 20px; height: 20px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 5px; border: 2px solid var(--bg);
}
.chat-panel {
  position: fixed; bottom: 20px; right: 20px; z-index: 95;
  width: 340px; max-width: calc(100vw - 32px);
  height: 480px; max-height: calc(100vh - 100px);
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 18px; display: flex; flex-direction: column;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5); overflow: hidden;
  animation: slideUp 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.chat-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.chat-close {
  background: transparent; border: none; color: var(--ink-dim);
  cursor: pointer; padding: 4px; display: flex; border-radius: 6px;
}
.chat-close:hover { background: var(--soft); color: var(--ink); }
.chat-messages {
  flex: 1; overflow-y: auto; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.chat-msg { display: flex; flex-direction: column; align-items: flex-start; max-width: 85%; }
.chat-msg.mine { align-self: flex-end; align-items: flex-end; }
.chat-msg-meta {
  font-size: 11px; color: var(--ink-faint); margin-bottom: 3px; padding: 0 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.chat-msg-bubble {
  background: var(--soft); padding: 8px 12px; border-radius: 14px;
  font-size: 14px; line-height: 1.4; word-break: break-word;
  border-top-left-radius: 4px;
}
.chat-msg.mine .chat-msg-bubble {
  background: var(--gold); color: var(--bg); font-weight: 500;
  border-top-left-radius: 14px; border-top-right-radius: 4px;
}
.chat-input-row {
  display: flex; gap: 8px; padding: 12px 14px;
  border-top: 1px solid var(--line); flex-shrink: 0;
}
.chat-input-row .input { flex: 1; }

/* ===== HOME SCREEN ===== */
.home-screen {
  position: relative;
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 20px; text-align: center;
}
.home-glow {
  position: absolute; top: 12%; left: 50%;
  width: min(720px, 90vw); height: min(420px, 50vh);
  transform: translateX(-50%);
  background: radial-gradient(closest-side, rgba(232,74,48,0.20), rgba(240,180,41,0.08) 55%, transparent 75%);
  filter: blur(18px); pointer-events: none; z-index: 0;
  animation: homeGlow 7s ease-in-out infinite;
}
@keyframes homeGlow {
  0%, 100% { opacity: 0.75; transform: translateX(-50%) scale(1); }
  50%      { opacity: 1;    transform: translateX(-50%) scale(1.07); }
}
.home-hero, .home-actions, .feature-pills, .home-links { position: relative; z-index: 1; }
.home-hero { margin-bottom: 40px; }
.home-hero .hero-sub { max-width: 520px; margin: 16px auto 0; line-height: 1.6; }

.home-actions {
  display: flex; gap: 12px; flex-wrap: wrap;
  justify-content: center; width: 100%; max-width: 520px;
}
.home-cta { flex: 1 1 200px; }

.feature-pills {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; margin-top: 28px;
  max-width: 560px;
}
.feature-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  color: var(--ink-dim);
  padding: 6px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 600;
  transition: all 0.18s ease;
}
.feature-pill:hover { color: var(--ink); border-color: rgba(240,180,41,0.4); transform: translateY(-1px); }

.home-links {
  display: flex; align-items: center; gap: 10px;
  margin-top: 32px; flex-wrap: wrap; justify-content: center;
}
.home-links-sep { color: var(--ink-faint); }
.link-btn {
  background: none; border: none; cursor: pointer;
  color: var(--ink-dim); font-family: inherit; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 2px; transition: color 0.15s;
}
.link-btn:hover { color: var(--gold); }

/* YouTube question embed */
.yt-wrap {
  width: 100%; max-width: 640px;
  aspect-ratio: 16 / 9;
  border-radius: 14px; overflow: hidden;
  border: 1px solid var(--line);
  background: #000;
}
.yt-wrap { position: relative; }
.yt-wrap iframe { width: 100%; height: 100%; display: block; }
/* Hides the video title / channel strip YouTube draws over the top of the player */
.yt-shade-top, .yt-shade-bottom {
  /* Players see just the picture — YouTube's own bars are masked out */
  position: absolute; left: 0; right: 0; z-index: 3;
  background: #000; pointer-events: none;
}
.yt-shade-top { top: 0; height: 56px; }
.yt-shade-bottom { bottom: 0; height: 48px; }

.yt-poster-cover {
  /* Masks the video thumbnail so players can't guess from the preview frame */
  position: absolute; inset: 0; z-index: 4;
  background: #000; color: var(--ink-dim);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; pointer-events: none;
}

.yt-block {
  /* Transparent shield so players can see the video but can't control it */
  position: absolute; inset: 0; z-index: 3;
  background: transparent; cursor: not-allowed;
}
.yt-title-cover {
  /* Covers only the title text on the left — leaves YouTube's own buttons
     (mute, settings, subtitles) on the right visible and clickable. */
  position: absolute; top: 0; left: 0; right: 150px; height: 46px;
  background: #000; z-index: 2; pointer-events: none;
}

/* Uploaded avatar pictures */
.avatar-img {
  width: 1.15em; height: 1.15em;
  border-radius: 50%; object-fit: cover;
  vertical-align: -0.2em; display: inline-block;
  border: 1px solid rgba(255,255,255,0.15);
}
.avatar-btn .avatar-img { width: 26px; height: 26px; vertical-align: middle; }
.player-avatar .avatar-img { width: 1.1em; height: 1.1em; }

/* Volume control shown to players on audio questions */
.vol-row {
  display: flex; align-items: center; gap: 10px;
  margin-top: 12px; justify-content: center;
}
.vol-slider {
  -webkit-appearance: none; appearance: none;
  width: 100%; max-width: 220px; height: 5px;
  border-radius: 999px; background: var(--line);
  outline: none; cursor: pointer;
}
.vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--gold); cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
.vol-slider::-moz-range-thumb {
  width: 16px; height: 16px; border: none; border-radius: 50%;
  background: var(--gold); cursor: pointer;
}

/* Audio question player */
.audio-player {
  width: 100%; max-width: 460px;
  background: var(--soft); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px 16px; text-align: center;
}
.audio-player audio { filter: invert(0.9) hue-rotate(180deg); border-radius: 8px; }

/* Editable score row (round_done) */
.spotlight-card { animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
.editable-row { cursor: pointer; transition: background 0.15s; border-radius: 8px; }
.editable-row:hover { background: var(--soft-hover); }

/* VERSION BADGE (top-right floating) */
.version-badge {
  position: fixed;
  top: 12px; right: 12px;
  z-index: 90;
  background: var(--soft);
  border: 1px solid var(--line);
  color: var(--ink-dim);
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-size: 12px; font-weight: 600;
  padding: 5px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.15s;
  backdrop-filter: blur(8px);
}
.version-badge:hover {
  background: var(--gold);
  color: var(--bg);
  border-color: var(--gold);
}

</style>
