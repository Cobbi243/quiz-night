<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Night — Своя Гра</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Podkova:wght@500;600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="config.js"></script>
<style>
:root {
  --bg: #bfa87e; --bg-2: #d8c7a2; --ink: #1a1816; --cream: #f5ebd4;
  --ink-dim: #433c33; --ink-faint: #6b6154;
  --accent: #ad5d29; --accent-dark: #8b4715;
  --gold: #ad5d29; --gold-dark: #8b4715;
  --green: #63724a; --red: #8a3512;
  --line: rgba(26, 24, 22, 0.22);
  --soft: rgba(26, 24, 22, 0.08); --soft-hover: rgba(26, 24, 22, 0.13);
  --stage: #232b18;

  /* Typography — change these to restyle the whole app */
  --font-display: Podkova, Georgia, serif;
  --font-body: Figtree, system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;

  /* Spacing scale */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;

  /* Corner radii */
  --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-xl: 28px; --r-pill: 999px;

  /* Elevation */
  --shadow-soft: 0 2px 6px rgba(50,35,16,0.16);
  --shadow-card: 0 10px 24px rgba(50,35,16,0.22);
  --shadow-stage: 0 20px 44px rgba(50,35,16,0.30);

  /* Tinted surfaces built from the accent colours */
  --gold-a08: rgba(173,93,41,0.08);
  --gold-a12: rgba(173,93,41,0.14);
  --gold-a25: rgba(173,93,41,0.28);
  --gold-a45: rgba(173,93,41,0.50);
  --accent-a15: rgba(173,93,41,0.15);
  --accent-a40: rgba(173,93,41,0.42);
  --green-a08: rgba(99,114,74,0.10);
  --green-a30: rgba(99,114,74,0.32);
  --green-a50: rgba(99,114,74,0.52);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  background-image:
    radial-gradient(1200px 600px at 85% -5%, rgba(173,93,41,0.10), transparent 60%),
    radial-gradient(900px 500px at 10% 105%, rgba(99,114,74,0.10), transparent 55%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  min-height: 100vh; -webkit-font-smoothing: antialiased;
}
.grain {
  position: fixed; inset: 0; pointer-events: none; opacity: 0.045; z-index: 0;
  background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
#app { position: relative; z-index: 1; min-height: 100vh; padding: 24px; }

@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.slide-up { animation: slideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.spin { animation: spin 1s linear infinite; display: inline-block; }

.container { max-width: 720px; margin: 0 auto; }
.container-sm { max-width: 460px; margin: 0 auto; }
.container-lg { max-width: 1100px; margin: 0 auto; }
.center-screen { min-height: calc(100vh - 48px); display: flex; flex-direction: column; align-items: center; justify-content: center; }

.btn {
  font-family: var(--font-body);
  font-weight: 500; padding: 12px 24px; font-size: 16px;
  border: none; border-radius: 999px; cursor: pointer;
  transition: all 0.15s ease; display: inline-flex; align-items: center;
  justify-content: center; gap: 8px;
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--cream); box-shadow: 0 8px 20px rgba(173,93,41,0.28); }
.btn-primary:hover:not(:disabled) { background: var(--accent-dark); }
.btn-accent { background: var(--accent); color: var(--cream); }
.btn-accent:hover:not(:disabled) { background: var(--accent-dark); }
.btn-gold { background: var(--gold); color: var(--cream); }
.btn-gold:hover:not(:disabled) { background: var(--gold-dark); }
.btn-green { background: var(--green); color: var(--cream); }
.btn-green:hover:not(:disabled) { background: #4c5936; }
.btn-red { background: var(--red); color: var(--cream); }
.btn-red:hover:not(:disabled) { background: #73280b; }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn-ghost:hover:not(:disabled) { background: var(--soft); }
.btn-lg { padding: 16px 32px; font-size: 18px; }
.btn-sm { padding: 8px 16px; font-size: 14px; }
.btn-full { width: 100%; }

.card { background: var(--bg-2); border: 1px solid rgba(32,30,29,0.10); border-radius: 28px; padding: 24px; box-shadow: var(--shadow-card); }

.input {
  width: 100%; background: transparent; border: none;
  border-bottom: 1px solid var(--line); padding: 12px 0;
  font-family: var(--font-body);
  font-size: 18px; color: var(--ink); outline: none;
  transition: border-color 0.15s;
}
.input:focus { border-bottom-color: var(--accent); }
.btn:focus-visible, .board-cell:focus-visible, .input:focus-visible, .source-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.input::placeholder { color: var(--ink-faint); }
.input-code {
  font-family: var(--font-display);
  font-size: 64px; font-weight: 700;
  letter-spacing: 0.3em; text-align: center; text-transform: uppercase;
}

.back-btn {
  background: transparent; border: none; cursor: pointer;
  color: var(--ink-dim); font-family: inherit; font-size: 14px;
  display: inline-flex; align-items: center; gap: 4px; padding: 4px;
  margin-bottom: 32px;
}
.back-btn:hover { color: var(--ink); }

.avatar-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-top: 8px; }
.avatar-btn {
  background: var(--soft); border: none; cursor: pointer;
  font-size: 22px; padding: 8px; border-radius: 14px;
  transition: all 0.15s;
}
.avatar-btn:hover { background: var(--soft-hover); }
.avatar-btn.active { background: var(--accent); transform: scale(1.1); }

.eyebrow {
  color: #743911; font-size: 12px; letter-spacing: 0.3em;
  margin-bottom: 12px; text-transform: uppercase; font-weight: 700;
}
.hero-title {
  font-family: var(--font-display);
  font-weight: 900; font-size: clamp(56px, 11vw, 112px);
  line-height: 0.85; text-align: center;
}
.hero-title em { font-style: normal; color: var(--accent); }
.hero-sub {
  color: var(--ink-dim); margin-top: 24px;
  max-width: 440px; text-align: center;
  font-size: 15px; line-height: 1.5;
}

.options-row { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 480px; }
@media (min-width: 540px) { .options-row { flex-direction: row; } }

.code-display { text-align: right; }
.code-label {
  font-size: 11px; color: var(--ink-dim);
  letter-spacing: 0.15em; margin-bottom: 4px; text-transform: uppercase;
}
.code-value {
  background: none; border: none; cursor: pointer;
  font-family: var(--font-display);
  font-size: 36px; font-weight: 800; color: var(--accent);
  letter-spacing: 0.2em; display: flex; align-items: center; gap: 8px; padding: 0;
}
.code-value:hover { color: var(--accent-dark); }

.players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.player-card { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 20px; background: var(--bg-2); border: 1px solid rgba(32,30,29,0.10); position: relative; }
.kick-btn {
  margin-left: auto; flex-shrink: 0;
  background: transparent; border: 1px solid var(--line);
  color: var(--ink-faint); cursor: pointer;
  width: 28px; height: 28px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.kick-btn:hover { background: rgba(138,53,18,0.12); border-color: var(--red); color: var(--red); }
.player-card.me { background: rgba(173,93,41,0.14); border: 1px solid rgba(173,93,41,0.42); }
.player-avatar { font-size: 24px; }
.player-name { font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 4px; min-width: 0; }
.name-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.host-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(99,114,74,0.18); color: #3e4a29;
  padding: 4px 12px; border-radius: 999px;
  font-size: 11px; letter-spacing: 0.1em;
  text-transform: uppercase; margin-bottom: 16px; font-weight: 700;
}

.source-card {
  display: flex; align-items: center; gap: 16px;
  padding: 22px; border-radius: 24px;
  background: var(--bg-2); border: 1px solid rgba(32,30,29,0.10);
  cursor: pointer; transition: background 0.15s;
  font-family: inherit; color: var(--ink); width: 100%; text-align: left;
}
.source-card:hover { border-color: var(--accent); }
.source-icon {
  width: 50px; height: 50px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.source-icon.gold { background: var(--gold); color: var(--cream); }
.source-icon.red { background: var(--accent); color: var(--ink); }
.source-icon.green { background: var(--green); color: var(--cream); }
.source-icon.blue { background: #4c5936; color: var(--cream); }
.source-icon.purple { background: #743911; color: var(--cream); }
.source-title { font-weight: 700; font-size: 16px; }
.source-sub { font-size: 13px; color: var(--ink-dim); margin-top: 2px; }

.err-text { color: var(--red); font-size: 14px; margin-top: 16px; }
.info-text { color: var(--ink-dim); font-size: 14px; margin-top: 16px; }

/* JEOPARDY BOARD */
.board-wrap { background: var(--stage); border-radius: 28px; padding: 20px; box-shadow: var(--shadow-stage); }
.board { display: grid; gap: 8px; grid-template-columns: repeat(6, 1fr); grid-template-rows: auto repeat(5, minmax(80px, 1fr)); }
.board-header {
  background: var(--accent);
  border-radius: 16px; padding: 10px 6px;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  min-height: 64px; max-height: 96px;      /* long names can't stretch the row */
  overflow: hidden; min-width: 0;
  border: none;
  box-shadow: none;
}
.board-header .cat-name {
  font-family: var(--font-display);
  font-weight: 700; font-size: clamp(9px, 1.15vw, 14px);
  text-transform: uppercase; letter-spacing: 0.02em;
  color: var(--cream); line-height: 1.15;
  width: 100%; min-width: 0;
  overflow: hidden; overflow-wrap: anywhere; hyphens: auto;
  /* Cut off after five lines with an ellipsis rather than pushing the board down */
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5;
}
.board-cell {
  position: relative;
  background: #3d4927;
  border-radius: 20px; cursor: pointer;
  border: none;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display);
  font-weight: 900; font-size: clamp(20px, 2.6vw, 36px);
  color: var(--cream);
  transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.14s ease, border-color 0.14s ease;
  padding: 8px;
  text-shadow: none;
  box-shadow: none;
}
.board-cell:hover:not(:disabled) {
  background: #e9d7b8;
  color: #2f391f;
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 8px 20px rgba(0,0,0,0.22);
  z-index: 1;
}
.board-cell:active:not(:disabled) { transform: translateY(0) scale(0.99); }
.board-cell.used {
  background: rgba(233,215,184,0.07);
  color: transparent; cursor: default;
  border: 1px dashed rgba(233,215,184,0.18);
  box-shadow: none;
}
.board-cell:disabled { cursor: not-allowed; }
.cell-img-icon {
  position: absolute; top: 6px; right: 6px;
  color: var(--cream); opacity: 0.7;
  display: flex; align-items: center; gap: 3px;
  pointer-events: none;
  /* Emoji markers inherit the cell's huge font size otherwise */
  font-size: 12px; line-height: 1;
  text-shadow: none;
}

.player-bar { display: flex; gap: 12px; margin-top: 24px; overflow-x: auto; padding-bottom: 8px; }
.player-chip {
  background: var(--bg-2); border-radius: 22px;
  padding: 12px 16px; min-width: 140px; flex-shrink: 0;
  border: 2px solid rgba(32,30,29,0.10); transition: all 0.2s;
}
.player-chip.current-picker { border-color: var(--accent); box-shadow: 0 8px 22px rgba(173,93,41,0.25); }
.player-chip.me { border-color: var(--green); }
.player-chip-top { display: flex; align-items: center; gap: 8px; }
.player-chip-name { font-weight: 600; font-size: 13px; flex: 1; min-width: 0; }
.player-chip-score {
  font-family: var(--font-display);
  font-weight: 800; font-size: 24px;
  color: #743911; margin-top: 4px;
}
.player-chip-score.negative { color: var(--red); }

.picker-banner { text-align: center; margin-bottom: 16px; font-size: 14px; color: var(--ink-dim); }
.picker-banner b { color: #743911; }

/* QUESTION VIEW */
.q-stage {
  background: var(--stage); border-radius: 28px;
  padding: 40px 24px; min-height: 60vh;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-stage);
}

/* ===== Fixed-height question screen (no page scroll; sticky controls) ===== */
.question-screen {
  max-width: 1100px; margin: 0 auto;
  min-height: calc(100vh - 24px);
  min-height: calc(100dvh - 24px);
  display: flex; flex-direction: column;
  gap: 12px;
  padding: 12px 0 0;
}
.qs-topbar {
  flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center;
}
.qs-stage {
  flex: 1 1 auto;
  background: var(--stage); border-radius: 28px;
  box-shadow: var(--shadow-stage);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.qs-stage-header {
  flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 24px 12px; font-size: 14px;
}
.qs-stage-body {
  flex: 1 1 auto; min-height: 0;
  overflow: visible;                            /* the page scrolls instead of an inner scrollbar */
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  text-align: center;
  padding: 8px 24px 24px;
}
/* Auto margins centre the content when it fits, but never clip the top when it
   overflows (which plain `justify-content:center` does). */
.qs-body-inner {
  margin: auto 0; width: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
}
/* Media shrinks to whatever room is left, so the buzzer always stays visible */
.qs-body-inner .q-image,
.qs-body-inner .yt-wrap { flex: 0 1 auto; min-height: 0; }
.qs-body-inner .audio-player { flex: 0 0 auto; }
/* The host's answer hint gets its own reserved space instead of overlapping */
.host-answer-box {
  flex: 0 1 auto; min-height: 0; width: 100%; max-width: 700px;
  margin-top: 12px; padding: 12px;
  background: rgba(245,235,212,0.12);
  border: 2px dashed rgba(245,235,212,0.35);
  border-radius: 20px; color: var(--cream);
}
.qs-body-inner .qs-question-text { flex: 0 1 auto; min-height: 0; }
/* Auto-sizing question text: scales with viewport, smaller floor so long text fits */
.qs-question-text {
  font-family: var(--font-display);
  font-weight: 800; line-height: 1.15; color: var(--cream);
  max-width: 900px; white-space: pre-wrap;
  font-size: clamp(20px, 3.2vw, 42px);
}
/* Length-based shrink: long questions get a smaller clamp via a modifier */
.qs-question-text.long   { font-size: clamp(18px, 2.6vw, 32px); }
.qs-question-text.xlong  { font-size: clamp(14px, 1.9vw, 24px); line-height: 1.22; }
.qs-controls {
  position: sticky; bottom: 0; z-index: 20;
  flex-shrink: 0;
  display: flex; flex-direction: column; gap: 10px;
  padding: 12px 0 14px;
  background: linear-gradient(to bottom, rgba(226,207,171,0) 0%, var(--bg) 22%, var(--bg) 100%);
}

.q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; font-size: 14px; }
.q-cat { text-transform: uppercase; letter-spacing: 0.15em; color: #d9c9a8; font-weight: 700; }
.q-value { font-family: var(--font-display); font-weight: 800; font-size: 32px; color: #dd8e50; }
.q-text { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px 0; flex-direction: column; gap: 16px; }
.q-image { max-width: 100%; max-height: 60vh; height: auto; border-radius: 12px; object-fit: contain; }
.q-text-inner {
  font-family: var(--font-display);
  font-weight: 800; color: var(--cream); font-size: clamp(24px, 4vw, 44px);
  line-height: 1.2; max-width: 900px;
  white-space: pre-wrap;
}
.q-answer-reveal {
  margin-top: 24px; padding: 16px;
  background: rgba(245,235,212,0.12);
  border: 2px dashed rgba(245,235,212,0.35);
  border-radius: 20px; text-align: center; color: var(--cream);
}
.q-answer-reveal-label { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; margin-bottom: 4px; }
.q-answer-reveal-text { font-family: var(--font-display); font-weight: 800; font-size: 22px; white-space: pre-wrap; }

.buzz-btn {
  background: var(--accent); color: var(--cream);
  border: none; border-radius: 999px;
  padding: 24px 48px; cursor: pointer;
  font-family: inherit; font-weight: 700; font-size: 22px;
  width: 100%; max-width: 360px; margin: 0 auto;
  display: block; transition: all 0.15s;
  box-shadow: 0 12px 32px rgba(173,93,41,0.4);
  animation: buzzPulse 1.8s ease-in-out infinite;
}
@keyframes buzzPulse {
  0%, 100% { box-shadow: 0 12px 32px rgba(173,93,41,0.35); }
  50% { box-shadow: 0 12px 40px rgba(173,93,41,0.6); }
}
.buzz-btn:hover:not(:disabled) {
  background: var(--accent-dark); transform: translateY(-2px);
  box-shadow: 0 16px 40px rgba(173,93,41,0.5);
  animation: none;
}
.buzz-btn:active:not(:disabled) { transform: scale(0.97); }
.buzz-btn:disabled { background: rgba(32,30,29,0.10); color: var(--ink-faint); cursor: not-allowed; box-shadow: none; opacity: 0.6; animation: none; }
.buzz-btn.cooldown { animation: buzzShake 0.4s ease; background: rgba(32,30,29,0.10); color: var(--ink-faint); }
@keyframes buzzShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}

.buzzed-banner { background: var(--accent); color: var(--cream); border-radius: 24px; padding: 20px 24px; text-align: center; }
.buzzed-banner-label { font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
.buzzed-banner-name { font-family: var(--font-display); font-weight: 900; font-size: 32px; }

.host-controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
.host-controls .btn { flex: 1; min-width: 140px; }
.attempted-list { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
.attempted-chip { background: rgba(245,235,212,0.18); padding: 6px 13px; border-radius: 999px; font-size: 12px; color: #cbbfa6; text-decoration: line-through; }

/* SETUP */
.cat-input-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.cat-input-row .num { font-family: var(--font-display); font-weight: 800; color: #743911; width: 24px; text-align: center; }
.cat-input-row input { flex: 1; }

.q-builder-card { background: var(--bg-2); border: 1px solid rgba(32,30,29,0.10); border-radius: 24px; padding: 18px; margin-bottom: 12px; }
.q-builder-question { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.q-builder-question .value-pill {
  background: var(--accent); color: var(--cream);
  border-radius: 999px; padding: 4px 10px;
  font-family: var(--font-display); font-weight: 700;
  font-size: 12px; flex-shrink: 0; min-width: 36px; text-align: center;
}
.q-builder-question .q-text-input, .q-builder-question .a-text-input {
  flex: 1; background: transparent; border: none;
  border-bottom: 1px solid var(--line);
  padding: 6px 0; color: var(--ink); outline: none;
  font-family: inherit; font-size: 14px;
}
.q-builder-question .q-text-input:focus, .q-builder-question .a-text-input:focus { border-bottom-color: var(--accent); }
.q-builder-question .a-text-input { color: #3e4a29; }

.q-image-row { display: flex; align-items: center; gap: 8px; margin-left: 46px; margin-top: 4px; font-size: 12px; }
.q-image-btn { background: var(--soft); border: 1px dashed var(--line); padding: 6px 10px; border-radius: 8px; color: var(--ink-dim); cursor: pointer; font-family: inherit; font-size: 12px; }
.q-image-btn:hover { background: var(--soft-hover); color: var(--ink); }
.q-image-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
.q-image-clear { background: transparent; border: none; color: var(--red); cursor: pointer; padding: 4px; }

/* FILE UPLOAD */
.dropzone {
  border: 2px dashed rgba(196,142,89,0.7); border-radius: 28px;
  padding: 40px 24px; text-align: center; cursor: pointer;
  transition: all 0.15s; background: var(--bg-2);
}
.dropzone:hover, .dropzone.drag { border-color: var(--accent); background: rgba(173,93,41,0.07); }
.dropzone-title { font-weight: 700; font-size: 16px; margin-top: 12px; }
.dropzone-sub { color: var(--ink-dim); font-size: 13px; margin-top: 4px; }

.parsed-preview { max-height: 360px; overflow-y: auto; }
.parsed-cat { margin-bottom: 16px; }
.parsed-cat-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; color: #743911; margin-bottom: 8px; }
.parsed-q { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.parsed-q .v { color: #743911; font-weight: 700; }
.parsed-q .a { color: #3e4a29; font-size: 12px; margin-top: 2px; }

/* SAVED PACKS */
.saved-pack {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-radius: 12px;
  background: var(--bg-2); border: 1px solid rgba(32,30,29,0.10); margin-bottom: 8px;
  cursor: pointer; transition: background 0.15s;
}
.saved-pack:hover { background: var(--soft-hover); }
.saved-pack-info { flex: 1; min-width: 0; }
.saved-pack-name { font-weight: 600; font-size: 15px; }
.saved-pack-meta { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
.saved-pack-actions { display: flex; gap: 4px; }
.icon-btn { background: transparent; border: none; color: var(--ink-dim); cursor: pointer; padding: 8px; border-radius: 8px; }
.icon-btn:hover { background: var(--soft-hover); color: var(--ink); }
.icon-btn.danger:hover { color: var(--red); }

/* RESULTS */
.winner-card {
  display: inline-flex; flex-direction: column; align-items: center;
  background: var(--accent); color: var(--cream);
  border-radius: 28px; padding: 32px 48px;
  box-shadow: 0 16px 36px rgba(173,93,41,0.30);
}
.winner-emoji { font-size: 72px; margin-bottom: 8px; }
.winner-name { font-family: var(--font-display); font-size: 40px; font-weight: 900; }
.winner-score { font-size: 14px; opacity: 0.85; margin-top: 4px; font-weight: 700; }
.final-row { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 20px; background: var(--bg-2); border: 1px solid rgba(32,30,29,0.10); margin-bottom: 8px; }
.final-row.first { background: rgba(173,93,41,0.14); border: 1px solid rgba(173,93,41,0.42); }
.final-row .rank { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--ink-faint); width: 32px; }
.final-row .name { flex: 1; font-weight: 500; }
.final-row .pts { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: #743911; }
.final-row .pts.negative { color: var(--red); }

/* SETUP WARNING */
.setup-warning {
  background: rgba(173,93,41,0.10); border: 1px solid rgba(173,93,41,0.4);
  border-radius: 12px; padding: 16px; margin-bottom: 24px;
  color: var(--ink); font-size: 13px; line-height: 1.5;
}
.setup-warning b { color: #743911; }
.setup-warning code { background: var(--soft); padding: 1px 6px; border-radius: 4px; font-size: 12px; }

/* FORMAT HINT */
.format-hint {
  background: var(--soft); border-radius: 10px;
  padding: 12px 16px; font-size: 12px;
  color: var(--ink-dim); margin-top: 12px;
  font-family: ui-monospace, 'Cascadia Code', monospace;
  white-space: pre-wrap; line-height: 1.5;
}

/* HOST: clickable score chip */
.player-chip.editable { cursor: pointer; }
.player-chip.editable:hover { background: var(--soft-hover); }
.player-chip.editable .player-chip-score { position: relative; }
.player-chip.editable .player-chip-score::after {
  content: '✏';
  position: absolute; top: -4px; right: -8px;
  font-size: 11px; opacity: 0; transition: opacity 0.15s;
}
.player-chip.editable:hover .player-chip-score::after { opacity: 0.6; }

/* SCORE EDIT MODAL */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(47,36,20,0.55);
  z-index: 100; display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.modal {
  background: var(--bg-2); border: 1px solid rgba(32,30,29,0.10);
  border-radius: 28px; padding: 24px;
  max-width: 420px; width: 100%; box-shadow: var(--shadow-card);
  animation: slideUp 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.modal-title {
  font-family: var(--font-display);
  font-weight: 700; font-size: 22px; margin-bottom: 4px;
}
.modal-subtitle {
  font-size: 13px; color: var(--ink-dim); margin-bottom: 20px;
}
.modal-score {
  font-family: var(--font-display);
  font-weight: 800; font-size: 56px;
  color: #743911; text-align: center;
  margin: 16px 0;
}
.modal-score.negative { color: var(--red); }
.score-buttons {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 8px; margin-bottom: 12px;
}
.score-btn {
  background: var(--soft); color: var(--ink);
  border: none; border-radius: 999px; padding: 12px 4px;
  font-family: var(--font-body);
  font-weight: 700; font-size: 14px;
  cursor: pointer; transition: all 0.15s;
}
.score-btn:hover { background: var(--soft-hover); transform: translateY(-1px); }
.score-btn.minus { color: var(--red); }
.score-btn.plus { color: #3e4a29; }
.modal-actions {
  display: flex; gap: 8px; margin-top: 20px;
}
.modal-actions .btn { flex: 1; }

/* TIMER BAR */
.timer-bar {
  margin-bottom: 16px;
  background: var(--bg-2);
  border: 1px solid rgba(32,30,29,0.10);
  border-radius: 24px;
  padding: 10px 16px;
}
.timer-bar-label {
  font-size: 13px;
  color: var(--ink-dim);
  margin-bottom: 6px;
  text-align: center;
}
.timer-bar-label b { color: var(--ink); font-size: 16px; font-family: var(--font-display); }
.timer-bar-track {
  height: 9px;
  background: rgba(32, 30, 29, 0.12);
  border-radius: 3px;
  overflow: hidden;
}
.timer-bar-fill {
  height: 100%;
  transition: width 0.25s linear;
  border-radius: 3px;
}
/* TIMER CHIP PICKER */
.timer-chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.timer-chip {
  background: var(--soft); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 16px; font-family: var(--font-body);
  font-weight: 600; font-size: 14px; cursor: pointer;
  transition: all 0.15s; min-width: 56px;
}
.timer-chip:hover { background: var(--soft-hover); }
.timer-chip.active {
  background: var(--accent); color: var(--cream); border-color: var(--accent);
}

/* Prevent accidental text selection in interactive game areas */
.q-stage, .buzz-btn, .buzzed-banner, .player-bar, .board, .host-controls, .timer-bar {
  -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
}

/* Player bar: wrap into a grid so many players don't cause horizontal scroll */
.player-bar {
  display: grid !important;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px;
  margin-top: 24px;
  overflow: visible !important;
  padding-bottom: 0 !important;
}
.player-chip {
  min-width: 0 !important;
  flex-shrink: 1 !important;
}
.player-chip-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* CHAT WIDGET */
.chat-fab {
  position: fixed; bottom: 20px; right: 20px; z-index: 95;
  width: 60px; height: 60px; border-radius: 50%;
  background: var(--accent); color: var(--cream);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 24px rgba(173,93,41,0.35);
  transition: all 0.15s;
}
.chat-fab:hover { transform: scale(1.08); background: var(--accent-dark); }
.chat-fab-badge {
  position: absolute; top: -2px; right: -2px;
  background: var(--red); color: var(--cream);
  font-size: 11px; font-weight: 700;
  min-width: 20px; height: 20px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 5px; border: 2px solid var(--bg);
}
.chat-panel {
  position: fixed; bottom: 20px; right: 20px; z-index: 95;
  width: 340px; max-width: calc(100vw - 32px);
  height: 480px; max-height: calc(100vh - 100px);
  background: var(--bg-2); border: 1px solid rgba(32,30,29,0.10);
  border-radius: 28px; display: flex; flex-direction: column;
  box-shadow: 0 14px 34px rgba(85,60,30,0.22); overflow: hidden;
  animation: slideUp 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.chat-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.chat-close {
  background: transparent; border: none; color: var(--ink-dim);
  cursor: pointer; padding: 4px; display: flex; border-radius: 6px;
}
.chat-close:hover { background: var(--soft); color: var(--ink); }
.chat-messages {
  flex: 1; overflow-y: auto; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.chat-msg { display: flex; flex-direction: column; align-items: flex-start; max-width: 85%; }
.chat-msg.mine { align-self: flex-end; align-items: flex-end; }
.chat-msg-meta {
  font-size: 11px; color: var(--ink-faint); margin-bottom: 3px; padding: 0 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.chat-msg-bubble {
  background: rgba(32,30,29,0.07); padding: 10px 14px; border-radius: 20px;
  font-size: 14px; line-height: 1.4; word-break: break-word;
  border-bottom-left-radius: 6px;
}
.chat-msg.mine .chat-msg-bubble {
  background: var(--accent); color: var(--cream); font-weight: 500;
  border-bottom-left-radius: 20px; border-bottom-right-radius: 6px;
}
.chat-input-row {
  display: flex; gap: 8px; padding: 12px 14px;
  border-top: 1px solid var(--line); flex-shrink: 0;
}
.chat-input-row .input { flex: 1; }

/* ===== RESPONSIVE LAYOUT ===== */
/* Phones */
@media (max-width: 640px) {
  .container, .container-lg { padding-left: 14px; padding-right: 14px; }
  .board { gap: 5px; grid-template-rows: auto repeat(5, minmax(56px, 1fr)); }
  .board-wrap { padding: 10px; border-radius: var(--r-lg); }
  .board-cell { font-size: clamp(15px, 5vw, 24px); border-radius: var(--r-sm); }
  .board-header { min-height: 46px; max-height: 66px; padding: 6px 4px; }
  .board-header .cat-name { font-size: clamp(8px, 2.6vw, 11px); -webkit-line-clamp: 4; }
  .q-value { font-size: 24px; }
  .buzz-btn { padding: 18px 24px; font-size: 18px; }
  .player-bar { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .hero-title { font-size: clamp(44px, 16vw, 76px); }
  .modal { width: calc(100vw - 24px); padding: 18px; }
  .chat-panel { width: calc(100vw - 20px); height: 70vh; right: 10px; bottom: 10px; }
  .qs-stage-header { padding: 14px 14px 8px; }
  .qs-stage-body { padding: 6px 14px 16px; }
}

/* Tablets */
@media (min-width: 641px) and (max-width: 1024px) {
  .board { gap: 6px; grid-template-rows: auto repeat(5, minmax(68px, 1fr)); }
  .board-cell { font-size: clamp(18px, 3.2vw, 30px); }
  .board-header .cat-name { font-size: clamp(9px, 1.6vw, 13px); }
  .player-bar { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
}

/* Wide screens — keep things from stretching too far apart */
@media (min-width: 1600px) {
  .container { max-width: 820px; }
  .container-lg, .question-screen { max-width: 1320px; }
  .board { grid-template-rows: auto repeat(5, minmax(96px, 1fr)); }
}

/* Short windows (landscape phones): trim vertical padding so the buzzer fits */
@media (max-height: 560px) {
  .qs-stage-header { padding: 10px 16px 6px; }
  .qs-stage-body { padding: 4px 16px 10px; }
  .buzz-btn { padding: 14px 20px; font-size: 17px; }
  .qs-controls { padding: 8px 0 10px; }
}

/* ===== HOME SCREEN ===== */
.home-screen {
  position: relative;
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 20px; text-align: center;
}
.home-glow {
  position: absolute; top: 12%; left: 50%;
  width: min(720px, 90vw); height: min(420px, 50vh);
  transform: translateX(-50%);
  background: radial-gradient(closest-side, rgba(173,93,41,0.26), rgba(99,114,74,0.16) 58%, transparent 78%);
  filter: blur(14px); pointer-events: none; z-index: 0;
  animation: homeGlow 7s ease-in-out infinite;
}
@keyframes homeGlow {
  0%, 100% { opacity: 0.75; transform: translateX(-50%) scale(1); }
  50%      { opacity: 1;    transform: translateX(-50%) scale(1.07); }
}
.home-hero, .home-actions, .feature-pills, .home-links { position: relative; z-index: 1; }
.home-hero { margin-bottom: 40px; }
.home-hero .hero-sub { max-width: 520px; margin: 16px auto 0; line-height: 1.6; }

.home-actions {
  display: flex; gap: 12px; flex-wrap: wrap;
  justify-content: center; width: 100%; max-width: 520px;
}
.home-cta { flex: 1 1 200px; }

.feature-pills {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; margin-top: 28px;
  max-width: 560px;
}
.feature-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(245,235,212,0.55);
  border: 1px solid var(--line);
  color: var(--ink-dim);
  padding: 6px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 600;
  transition: all 0.18s ease;
}
.feature-pill:hover { color: var(--ink); border-color: rgba(173,93,41,0.45); transform: translateY(-1px); }

.home-links {
  display: flex; align-items: center; gap: 10px;
  margin-top: 32px; flex-wrap: wrap; justify-content: center;
}
.home-links-sep { color: var(--ink-faint); }
.link-btn {
  background: none; border: none; cursor: pointer;
  color: var(--ink-dim); font-family: inherit; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 2px; transition: color 0.15s;
}
.link-btn:hover { color: var(--accent); }

/* YouTube question embed */
.yt-wrap {
  width: 100%; max-width: 900px;
  aspect-ratio: 16 / 9;
  border-radius: 14px; overflow: hidden;
  border: 1px solid var(--line);
  background: #000;
}
.yt-wrap { position: relative; }
.yt-wrap iframe { width: 100%; height: 100%; display: block; }
/* Hides the video title / channel strip YouTube draws over the top of the player */
.yt-shade-top, .yt-shade-bottom {
  /* Players see just the picture — YouTube's own bars are masked out */
  position: absolute; left: 0; right: 0; z-index: 3;
  background: #000; pointer-events: none;
}
.yt-shade-top { top: 0; height: 15%; max-height: 56px; }
.yt-shade-bottom { bottom: 0; height: 14%; max-height: 48px; }

.yt-poster-cover {
  /* Masks the video thumbnail so players can't guess from the preview frame */
  position: absolute; inset: 0; z-index: 4;
  background: #000; color: var(--ink-dim);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; pointer-events: none;
}

.yt-block {
  /* Transparent shield so players can see the video but can't control it */
  position: absolute; inset: 0; z-index: 3;
  background: transparent; cursor: not-allowed;
}
.yt-title-cover {
  /* Covers only the title text on the left — leaves YouTube's own buttons
     (mute, settings, subtitles) on the right visible and clickable. */
  position: absolute; top: 0; left: 0; right: 150px; height: 46px;
  background: #000; z-index: 2; pointer-events: none;
}

/* Marker shown while a practice game is running */
.test-badge {
  position: fixed; top: 12px; left: 12px; z-index: 90;
  background: rgba(173,93,41,0.14);
  border: 1px solid rgba(173,93,41,0.5);
  color: #743911;
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
  padding: 5px 12px; border-radius: 999px;
  backdrop-filter: blur(8px); pointer-events: none;
}

/* Quick bet buttons in the final round */
.bid-quick-row {
  display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
}
.bid-quick-row .btn { flex: 1 1 auto; min-width: 56px; }

/* Stat tiles — numbers scale down instead of spilling out of the card */
.stat-row {
  display: flex; flex-wrap: wrap; gap: 10px;
}
/* Tiles grow with their number instead of wrapping it onto a second line */
.stat-row .stat-tile { flex: 1 1 auto; min-width: 88px; }

.stat-tile {
  text-align: center; padding: 14px 14px;
}
.stat-value {
  font-family: var(--font-display);
  font-weight: 900; line-height: 1.05;
  font-size: clamp(15px, 4.2vw, 28px);
  white-space: nowrap;          /* keep numbers on one line */
}
.stat-label {
  font-size: 10px; color: var(--ink-dim);
  margin-top: 3px; letter-spacing: 0.04em;
  white-space: nowrap;
}

/* Uploaded avatar pictures */
.avatar-img {
  width: 1.15em; height: 1.15em;
  border-radius: 50%; object-fit: cover;
  vertical-align: -0.2em; display: inline-block;
  border: 1px solid rgba(32,30,29,0.18);
}
.avatar-btn .avatar-img { width: 26px; height: 26px; vertical-align: middle; }
.player-avatar .avatar-img { width: 1.1em; height: 1.1em; }

/* Volume control shown to players on audio questions */
.vol-row {
  display: flex; align-items: center; gap: 10px;
  margin-top: 12px; justify-content: center;
}
.vol-slider {
  -webkit-appearance: none; appearance: none;
  width: 100%; max-width: 220px; height: 5px;
  border-radius: 999px; background: var(--line);
  outline: none; cursor: pointer;
}
.vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent); cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
.vol-slider::-moz-range-thumb {
  width: 18px; height: 18px; border: none; border-radius: 50%;
  background: var(--accent); cursor: pointer;
}

/* Audio question player */
.audio-player {
  width: 100%; max-width: 460px;
  background: var(--bg-2); border: 1px solid rgba(32,30,29,0.10);
  border-radius: 24px; padding: 14px 16px; text-align: center;
}
.audio-player audio { border-radius: 999px; }

/* Editable score row (round_done) */
.spotlight-card { animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
.editable-row { cursor: pointer; transition: background 0.15s; border-radius: 8px; }
.editable-row:hover { background: var(--soft-hover); }

/* VERSION BADGE (top-right floating) */
.version-badge {
  position: fixed;
  top: 12px; right: 12px;
  z-index: 90;
  background: var(--soft);
  border: 1px solid var(--line);
  color: var(--ink-dim);
  font-family: var(--font-body);
  font-size: 12px; font-weight: 600;
  padding: 5px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.15s;
  backdrop-filter: blur(8px);
}
.version-badge:hover {
  background: var(--accent);
  color: var(--cream);
  border-color: var(--accent);
}


/* =====================================================================
   TACTILE LAYER — the app as a physical board game.
   Every surface has a thickness (a hard bottom edge) and presses in when
   touched. Loaded last so it restyles the base sheet without touching markup.
   ===================================================================== */
:root {
  --edge: rgba(92, 61, 28, 0.45);
  --edge-strong: rgba(60, 40, 18, 0.55);
  --felt: #303a20;
  --felt-deep: #1f2615;
  --tile: #3f4c28;
  --tile-edge: #1d2413;
  --lift: 0 10px 22px rgba(85, 60, 30, 0.16);
}

/* ---- Ground: felt weave instead of a flat wash ---- */
html, body {
  background-image:
    repeating-linear-gradient(45deg, rgba(120,88,48,0.035) 0 2px, transparent 2px 4px),
    radial-gradient(1200px 620px at 82% -8%, rgba(173,93,41,0.13), transparent 62%),
    radial-gradient(900px 520px at 8% 106%, rgba(99,114,74,0.13), transparent 58%);
}
#app { padding: 20px 20px 24px; }
@media (min-width: 900px) { #app { padding: 28px 32px 32px; } }
.container-lg { max-width: 1340px; }
.container { max-width: 760px; }

/* ---- Everything with a face gets a thickness ---- */
.card, .player-card, .source-card, .q-builder-card, .saved-pack,
.final-row, .audio-player, .timer-bar, .modal, .chat-panel, .dropzone {
  border: 1px solid rgba(32,30,29,0.12);
  box-shadow: 0 3px 0 var(--edge), var(--lift);
}
.card { border-radius: 20px; padding: 22px; }

/* ---- Buttons: real keys that travel ---- */
.btn { border-radius: 999px; font-weight: 600; letter-spacing: 0.01em; }
.btn-primary, .btn-accent, .btn-gold {
  box-shadow: 0 4px 0 #6f3810, 0 10px 20px rgba(173,93,41,0.28);
}
.btn-green { box-shadow: 0 4px 0 #3b4629, 0 10px 20px rgba(99,114,74,0.26); }
.btn-red   { box-shadow: 0 4px 0 #5c230a, 0 10px 20px rgba(138,53,18,0.26); }
.btn-ghost { box-shadow: 0 3px 0 rgba(32,30,29,0.14); background: rgba(245,235,212,0.7); }
.btn-primary:hover:not(:disabled), .btn-accent:hover:not(:disabled),
.btn-gold:hover:not(:disabled), .btn-green:hover:not(:disabled),
.btn-red:hover:not(:disabled), .btn-ghost:hover:not(:disabled) {
  transform: translateY(-2px);
}
.btn:active:not(:disabled) {
  transform: translateY(3px) scale(1) !important;
  box-shadow: 0 1px 0 rgba(60,40,18,0.5) !important;
}

/* =====================  BOARD SCREEN  =====================
   The board fills the top of the screen; the players sit along the
   bottom as physical score chips that stay put while the board scrolls. */
.board-wrap {
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0 1px, transparent 1px 3px),
    var(--felt);
  border-radius: 22px;
  padding: 16px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.07), inset 0 -3px 0 rgba(0,0,0,0.3), 0 18px 40px rgba(60,40,18,0.28);
  border: 1px solid rgba(0,0,0,0.25);
}
.board { gap: 10px; grid-template-rows: auto repeat(5, minmax(76px, 1fr)); }

/* Category plates — engraved labels screwed onto the board */
.board-header {
  background: linear-gradient(180deg, #b96731 0%, #a4551f 100%);
  border-radius: 12px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 3px 0 #6f3810;
  min-height: 58px;
}
.board-header .cat-name { letter-spacing: 0.06em; }

/* Value tiles — raised, pressable, with a lit top edge */
.board-cell {
  background: linear-gradient(180deg, var(--tile) 0%, #3f4c27 100%);
  border-radius: 14px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 4px 0 var(--tile-edge), 0 8px 14px rgba(0,0,0,0.25);
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
}
.board-cell:hover:not(:disabled) {
  background: linear-gradient(180deg, #d7c39c 0%, #e2cfab 100%);
  color: var(--felt-deep);
  transform: translateY(-3px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 7px 0 #b79a6c, 0 14px 22px rgba(0,0,0,0.3);
}
.board-cell:active:not(:disabled) {
  transform: translateY(4px);
  box-shadow: inset 0 2px 5px rgba(0,0,0,0.35), 0 0 0 rgba(0,0,0,0);
}
/* A spent tile is a cut-out slot in the board, not a faded card */
.board-cell.used {
  background: rgba(0,0,0,0.22);
  border: none;
  box-shadow: inset 0 3px 6px rgba(0,0,0,0.45), inset 0 -1px 0 rgba(255,255,255,0.05);
}
.cell-img-icon { top: 8px; right: 9px; opacity: 0.8; }

.picker-banner {
  display: inline-flex; align-items: center; gap: 8px;
  margin: 0 0 14px; padding: 8px 18px;
  background: rgba(245,235,212,0.8);
  border: 1px solid rgba(32,30,29,0.12);
  border-radius: 999px;
  box-shadow: 0 3px 0 var(--edge);
  font-size: 14px;
}

/* Score chips docked to the bottom edge of the screen */
.player-bar {
  position: sticky; bottom: -4px; z-index: 30;
  display: grid !important;
  grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
  gap: 10px;
  margin: 20px -20px -24px;
  padding: 14px 20px 18px !important;
  background: linear-gradient(to bottom, rgba(226,207,171,0) 0%, var(--bg) 26%, var(--bg) 100%);
}
@media (min-width: 900px) { .player-bar { margin: 24px -32px -32px; padding: 16px 32px 22px !important; } }
.player-chip {
  position: relative;
  background: linear-gradient(180deg, #e6d6b4 0%, #d9c6a1 100%);
  border: 1px solid rgba(32,30,29,0.12);
  border-radius: 16px;
  padding: 10px 14px 12px;
  box-shadow: 0 4px 0 var(--edge), 0 8px 16px rgba(85,60,30,0.14);
  transition: transform 0.16s ease, box-shadow 0.16s ease;
}
.player-chip.current-picker {
  border-color: transparent;
  background: linear-gradient(180deg, #c97a3e 0%, #ad5d29 100%);
  color: var(--cream);
  transform: translateY(-5px);
  box-shadow: 0 6px 0 #6f3810, 0 14px 26px rgba(173,93,41,0.35);
}
.player-chip.current-picker .player-chip-score,
.player-chip.current-picker .player-chip-name { color: var(--cream); }
.player-chip.current-picker::after {
  content: ''; position: absolute; left: 50%; top: -7px;
  width: 10px; height: 10px; margin-left: -5px; border-radius: 2px;
  background: #ad5d29; transform: rotate(45deg);
}
.player-chip.me { box-shadow: 0 4px 0 #3b4629, 0 8px 16px rgba(99,114,74,0.2); }
.player-chip.editable:hover { transform: translateY(-3px); background: linear-gradient(180deg, #ece0c3 0%, #ddcca9 100%); }
.player-chip-score { margin-top: 2px; font-size: 22px; }

/* =====================  LOBBY  =====================
   Two columns on desktop: the room plaque and settings on the left,
   the table of seated players on the right. Cards look dealt. */
@media (min-width: 900px) {
  .lobby-cols { display: grid; grid-template-columns: 340px minmax(0,1fr); gap: 20px; align-items: start; }
}
.code-display {
  text-align: center;
  padding: 16px 22px;
  background: linear-gradient(180deg, #e6d6b4 0%, #d8c6a0 100%);
  border: 1px solid rgba(32,30,29,0.12);
  border-radius: 18px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 4px 0 var(--edge), var(--lift);
}
.code-value { justify-content: center; font-size: 42px; letter-spacing: 0.24em; text-shadow: 0 1px 0 rgba(255,255,255,0.7); }
.players-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
/* Each player is a card laid on the table, very slightly askew */
.player-card {
  flex-direction: column; align-items: flex-start; gap: 6px;
  padding: 14px 14px 12px;
  border-radius: 16px;
  background: linear-gradient(180deg, #e6d6b4 0%, #dccaa6 100%);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.player-card:nth-child(3n)   { transform: rotate(-0.5deg); }
.player-card:nth-child(3n+2) { transform: rotate(0.6deg); }
.player-card:hover { transform: translateY(-3px) rotate(0deg); box-shadow: 0 6px 0 var(--edge), 0 14px 24px rgba(85,60,30,0.18); }
.player-card .player-avatar { font-size: 30px; }
.player-card .player-name { font-size: 15px; font-weight: 600; }
.player-card.me { background: linear-gradient(180deg, #e2c49f 0%, #eccba4 100%); border-color: rgba(173,93,41,0.45); }
.kick-btn { position: absolute; top: 8px; right: 8px; margin: 0; border-radius: 999px; background: rgba(245,235,212,0.9); }
.host-badge { box-shadow: 0 3px 0 rgba(62,74,41,0.25); }

/* =====================  PACK SETUP  =====================
   Sources read as a shelf of tiles; each question is an index card
   with a numbered tab, so a long builder still scans in rows. */
.source-card {
  flex-direction: column; align-items: flex-start; gap: 10px;
  padding: 18px;
  background: linear-gradient(180deg, #e6d6b4 0%, #dccaa6 100%);
  border-radius: 18px;
  transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s;
}
.source-card:hover { transform: translateY(-3px); box-shadow: 0 6px 0 var(--edge), 0 14px 24px rgba(85,60,30,0.18); }
.source-card:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
.source-icon { width: 42px; height: 42px; border-radius: 12px; box-shadow: 0 3px 0 rgba(60,40,18,0.35); }
.source-title { font-family: var(--font-display); font-size: 18px; }

.q-builder-card {
  position: relative;
  padding: 16px 16px 14px 20px;
  border-radius: 16px;
  background: linear-gradient(180deg, #e6d6b4 0%, #dbc9a5 100%);
}
.q-builder-card::before {
  content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 5px;
  border-radius: 0 4px 4px 0; background: var(--accent); opacity: 0.55;
}
.q-builder-question { gap: 10px; padding: 4px 0; }
.q-builder-question .value-pill {
  border-radius: 8px; padding: 6px 10px; min-width: 44px;
  box-shadow: 0 2px 0 #6f3810;
}
.cat-input-row {
  gap: 12px; margin-bottom: 8px; padding: 6px 12px 6px 6px;
  background: rgba(251,243,226,0.7);
  border: 1px solid rgba(32,30,29,0.10);
  border-radius: 14px;
}
.cat-input-row .num {
  width: 30px; height: 30px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 999px; color: var(--cream);
  background: var(--accent); box-shadow: 0 2px 0 #6f3810;
  font-size: 14px;
}
.dropzone { border-style: dashed; border-width: 2px; border-radius: 20px; box-shadow: var(--lift); }
.dropzone:hover, .dropzone.drag { transform: translateY(-2px); }
.saved-pack { border-radius: 16px; padding: 14px 16px; }
.saved-pack:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--edge), var(--lift); }
.timer-chip {
  border-radius: 999px; box-shadow: 0 3px 0 rgba(32,30,29,0.14);
  background: rgba(251,243,226,0.85);
}
.timer-chip.active { box-shadow: 0 3px 0 #6f3810; }
.timer-chip:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(32,30,29,0.2); }

/* =====================  RESULTS  =====================
   A trophy plaque over a podium, then the rest as stacked tiles
   with rank medallions. */
.winner-card {
  position: relative;
  background: linear-gradient(180deg, #c97a3e 0%, #a4551f 100%);
  border-radius: 24px;
  padding: 30px 52px 26px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.25), 0 8px 0 #6f3810, 0 24px 44px rgba(85,60,30,0.3);
}
.winner-emoji { font-size: 64px; margin-bottom: 4px; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.25)); }
.winner-name { font-size: 38px; }
.winner-score {
  display: inline-block; margin-top: 10px; padding: 5px 16px;
  border-radius: 999px; background: rgba(32,30,29,0.22);
  opacity: 1; letter-spacing: 0.04em;
}
.final-row {
  gap: 14px; padding: 13px 16px; border-radius: 16px;
  background: linear-gradient(180deg, #e6d6b4 0%, #dccaa6 100%);
  transition: transform 0.15s ease;
}
.final-row:hover { transform: translateX(3px); }
.final-row .rank {
  width: 34px; height: 34px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 999px; font-size: 17px;
  color: var(--ink-dim);
  background: rgba(32,30,29,0.07);
  box-shadow: inset 0 -2px 0 rgba(32,30,29,0.08);
}
.final-row.first { background: linear-gradient(180deg, #e2c49f 0%, #ecc9a0 100%); border-color: rgba(173,93,41,0.45); }
.final-row.first .rank { background: var(--accent); color: var(--cream); box-shadow: 0 2px 0 #6f3810; }
.final-row .name { font-weight: 600; }

/* =====================  QUESTION  ===================== */
.q-stage, .qs-stage {
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0 1px, transparent 1px 3px),
    var(--felt-deep);
  border-radius: 22px;
  border: 1px solid rgba(0,0,0,0.25);
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.06), 0 18px 40px rgba(60,40,18,0.28);
}
.buzz-btn {
  border-radius: 999px;
  box-shadow: 0 8px 0 #6f3810, 0 16px 30px rgba(173,93,41,0.35);
  animation: none;
}
.buzz-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 11px 0 #6f3810, 0 20px 34px rgba(173,93,41,0.4); }
.buzz-btn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 #6f3810; }
.buzzed-banner {
  border-radius: 20px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.22), 0 6px 0 #6f3810, 0 16px 30px rgba(85,60,30,0.28);
  animation: bannerDrop 0.28s cubic-bezier(0.2, 1.3, 0.4, 1) both;
}
@keyframes bannerDrop { from { transform: translateY(-10px) scale(0.97); opacity: 0; } to { transform: none; opacity: 1; } }
.timer-bar { border-radius: 16px; padding: 10px 14px; }
.timer-bar-track { border-radius: 999px; box-shadow: inset 0 1px 2px rgba(32,30,29,0.18); }
.timer-bar-fill { border-radius: 999px; }
.attempted-chip { box-shadow: inset 0 -1px 0 rgba(0,0,0,0.2); }
.q-image, .yt-wrap { border-radius: 16px; }

/* =====================  MODALS · CHAT · HOME  ===================== */
.modal { border-radius: 22px; box-shadow: 0 6px 0 var(--edge-strong), 0 30px 60px rgba(40,26,10,0.4); }
.score-btn { box-shadow: 0 3px 0 rgba(32,30,29,0.14); background: rgba(251,243,226,0.9); }
.score-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(32,30,29,0.18); }
.chat-panel { border-radius: 22px; }
.chat-fab { box-shadow: 0 5px 0 #6f3810, 0 12px 24px rgba(173,93,41,0.3); }
.chat-fab:hover { transform: translateY(-2px) scale(1.04); }
.chat-fab:active { transform: translateY(3px); box-shadow: 0 1px 0 #6f3810; }
.hero-title { letter-spacing: -0.02em; text-shadow: 0 2px 0 rgba(255,255,255,0.45); }
.feature-pill { box-shadow: 0 2px 0 rgba(32,30,29,0.10); }
.feature-pill:hover { transform: translateY(-2px); }
.avatar-btn { box-shadow: 0 3px 0 rgba(32,30,29,0.12); background: rgba(251,243,226,0.9); }
.avatar-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(32,30,29,0.16); }
.avatar-btn.active { box-shadow: 0 3px 0 #6f3810; }
.input { border-bottom-width: 2px; }
.version-badge, .test-badge { box-shadow: 0 3px 0 rgba(32,30,29,0.12); }

/* ---- Dealt-in entrance, staggered ---- */
@keyframes dealIn { from { transform: translateY(14px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }
.players-grid > *, .final-row, .source-card {
  animation: dealIn 0.32s cubic-bezier(0.2, 0.9, 0.25, 1) both;
}
.players-grid > *:nth-child(2), .final-row:nth-child(2), .source-card:nth-child(2) { animation-delay: 0.04s; }
.players-grid > *:nth-child(3), .final-row:nth-child(3), .source-card:nth-child(3) { animation-delay: 0.08s; }
.players-grid > *:nth-child(4), .final-row:nth-child(4), .source-card:nth-child(4) { animation-delay: 0.12s; }
.players-grid > *:nth-child(5), .final-row:nth-child(5) { animation-delay: 0.16s; }
.players-grid > *:nth-child(n+6), .final-row:nth-child(n+6) { animation-delay: 0.2s; }

/* ---- Phone ---- */
@media (max-width: 600px) {
  #app { padding: 14px 14px 16px; }
  .board-wrap { padding: 10px; border-radius: 16px; }
  .board { gap: 6px; grid-template-rows: auto repeat(5, minmax(56px, 1fr)); }
  .board-cell { border-radius: 10px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 3px 0 var(--tile-edge); }
  .board-header { border-radius: 9px; min-height: 46px; }
  .player-bar { grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; margin: 16px -14px -16px; padding: 12px 14px 14px !important; }
  .player-chip { padding: 8px 10px 10px; border-radius: 13px; }
  .player-chip-score { font-size: 19px; }
  .code-value { font-size: 34px; }
  .winner-card { padding: 24px 28px 20px; }
  .winner-name { font-size: 30px; }
  .card { padding: 18px; border-radius: 18px; }
}
/* ---- Media markers on board cells: cream badges that read from across the room ---- */
.cell-media {
  position: absolute; top: 7px; left: 7px; right: auto;
  display: flex; gap: 4px; pointer-events: none; line-height: 0;
}
.cell-media-badge {
  width: 26px; height: 26px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #e6d6b4 0%, #eeddba 100%);
  color: #8b4715;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.75), 0 2px 0 rgba(60,40,18,0.45), 0 3px 6px rgba(0,0,0,0.25);
  transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease;
}
.cell-media-badge svg { stroke-width: 2.6; }
.board-cell:hover:not(:disabled) .cell-media-badge {
  background: linear-gradient(180deg, #c97a3e 0%, #ad5d29 100%);
  color: #e6d6b4;
  transform: translateY(-1px);
}
@media (max-width: 600px) {
  .cell-media { top: 5px; left: 5px; gap: 3px; }
  .cell-media-badge { width: 20px; height: 20px; border-radius: 7px; }
  .cell-media-badge svg { width: 12px; height: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  .players-grid > *, .final-row, .source-card, .buzzed-banner, .slide-up { animation: none !important; }
}
