<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Night — Своя Гра</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,900&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="config.js"></script>
<style>
:root {
  --bg: #0f0e17; --bg-2: #1a1825; --ink: #faf6ef;
  --ink-dim: rgba(250, 246, 239, 0.6); --ink-faint: rgba(250, 246, 239, 0.3);
  --accent: #e84a30; --accent-dark: #c93a23;
  --gold: #f0b429; --gold-dark: #c8941f;
  --green: #4ade80; --red: #ef4444;
  --line: rgba(250, 246, 239, 0.12);
  --soft: rgba(250, 246, 239, 0.06); --soft-hover: rgba(250, 246, 239, 0.1);
  --stage: linear-gradient(180deg, #1a1825 0%, #0f0e17 100%);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg); color: var(--ink);
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  min-height: 100vh; -webkit-font-smoothing: antialiased;
}
.grain {
  position: fixed; inset: 0; pointer-events: none; opacity: 0.06; z-index: 0;
  background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
#app { position: relative; z-index: 1; min-height: 100vh; padding: 24px; }

@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.slide-up { animation: slideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.spin { animation: spin 1s linear infinite; display: inline-block; }

.container { max-width: 720px; margin: 0 auto; }
.container-sm { max-width: 460px; margin: 0 auto; }
.container-lg { max-width: 1100px; margin: 0 auto; }
.center-screen { min-height: calc(100vh - 48px); display: flex; flex-direction: column; align-items: center; justify-content: center; }

.btn {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-weight: 500; padding: 12px 24px; font-size: 16px;
  border: none; border-radius: 12px; cursor: pointer;
  transition: all 0.15s ease; display: inline-flex; align-items: center;
  justify-content: center; gap: 8px;
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--ink); color: var(--bg); }
.btn-primary:hover:not(:disabled) { background: var(--gold); }
.btn-accent { background: var(--accent); color: var(--ink); }
.btn-accent:hover:not(:disabled) { background: var(--accent-dark); }
.btn-gold { background: var(--gold); color: var(--bg); }
.btn-gold:hover:not(:disabled) { background: var(--gold-dark); }
.btn-green { background: var(--green); color: var(--bg); }
.btn-green:hover:not(:disabled) { background: #22c55e; }
.btn-red { background: var(--red); color: var(--ink); }
.btn-red:hover:not(:disabled) { background: #dc2626; }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn-ghost:hover:not(:disabled) { background: var(--soft); }
.btn-lg { padding: 16px 32px; font-size: 18px; }
.btn-sm { padding: 8px 16px; font-size: 14px; }
.btn-full { width: 100%; }

.card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }

.input {
  width: 100%; background: transparent; border: none;
  border-bottom: 1px solid var(--line); padding: 12px 0;
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-size: 18px; color: var(--ink); outline: none;
  transition: border-color 0.15s;
}
.input:focus { border-bottom-color: var(--accent); }
.input::placeholder { color: var(--ink-faint); }
.input-code {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 64px; font-weight: 700;
  letter-spacing: 0.3em; text-align: center; text-transform: uppercase;
}

.back-btn {
  background: transparent; border: none; cursor: pointer;
  color: var(--ink-dim); font-family: inherit; font-size: 14px;
  display: inline-flex; align-items: center; gap: 4px; padding: 4px;
  margin-bottom: 32px;
}
.back-btn:hover { color: var(--ink); }

.avatar-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-top: 8px; }
.avatar-btn {
  background: var(--soft); border: none; cursor: pointer;
  font-size: 22px; padding: 8px; border-radius: 10px;
  transition: all 0.15s;
}
.avatar-btn:hover { background: var(--soft-hover); }
.avatar-btn.active { background: var(--gold); transform: scale(1.1); }

.eyebrow {
  color: var(--gold); font-size: 12px; letter-spacing: 0.3em;
  margin-bottom: 12px; text-transform: uppercase; font-weight: 700;
}
.hero-title {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 900; font-size: clamp(56px, 11vw, 112px);
  line-height: 0.85; text-align: center;
}
.hero-title em { font-style: italic; color: var(--accent); }
.hero-sub {
  color: var(--ink-dim); margin-top: 24px;
  max-width: 440px; text-align: center;
  font-size: 15px; line-height: 1.5;
}

.options-row { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 480px; }
@media (min-width: 540px) { .options-row { flex-direction: row; } }

.code-display { text-align: right; }
.code-label {
  font-size: 11px; color: var(--ink-dim);
  letter-spacing: 0.15em; margin-bottom: 4px; text-transform: uppercase;
}
.code-value {
  background: none; border: none; cursor: pointer;
  font-family: 'Fraunces', Georgia, serif;
  font-size: 36px; font-weight: 700; color: var(--gold);
  letter-spacing: 0.2em; display: flex; align-items: center; gap: 8px; padding: 0;
}
.code-value:hover { color: var(--accent); }

.players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.player-card { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--soft); }
.player-card.me { background: rgba(232, 74, 48, 0.15); border: 1px solid rgba(232, 74, 48, 0.4); }
.player-avatar { font-size: 24px; }
.player-name { font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 4px; min-width: 0; }
.name-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.host-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(240, 180, 41, 0.2); color: var(--gold);
  padding: 4px 12px; border-radius: 999px;
  font-size: 11px; letter-spacing: 0.1em;
  text-transform: uppercase; margin-bottom: 16px; font-weight: 700;
}

.source-card {
  display: flex; align-items: center; gap: 16px;
  padding: 20px; border-radius: 16px;
  background: var(--soft); border: none;
  cursor: pointer; transition: background 0.15s;
  font-family: inherit; color: var(--ink); width: 100%; text-align: left;
}
.source-card:hover { background: var(--soft-hover); }
.source-icon {
  width: 48px; height: 48px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.source-icon.gold { background: var(--gold); color: var(--bg); }
.source-icon.red { background: var(--accent); color: var(--ink); }
.source-icon.green { background: var(--green); color: var(--bg); }
.source-icon.blue { background: #5b9bd5; color: var(--bg); }
.source-icon.purple { background: #9b59b6; color: var(--ink); }
.source-title { font-weight: 700; font-size: 16px; }
.source-sub { font-size: 13px; color: var(--ink-dim); margin-top: 2px; }

.err-text { color: var(--accent); font-size: 14px; margin-top: 16px; }
.info-text { color: var(--ink-dim); font-size: 14px; margin-top: 16px; }

/* JEOPARDY BOARD */
.board-wrap { background: var(--stage); border-radius: 24px; padding: 20px; box-shadow: 0 24px 48px rgba(0,0,0,0.4); }
.board { display: grid; gap: 8px; grid-template-columns: repeat(6, 1fr); grid-template-rows: auto repeat(5, minmax(80px, 1fr)); }
.board-header {
  background: linear-gradient(180deg, #2a253d 0%, #1d1a2c 100%);
  border-radius: 10px; padding: 12px 8px;
  display: flex; align-items: center; justify-content: center;
  text-align: center; min-height: 64px;
}
.board-header .cat-name {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 700; font-size: clamp(10px, 1.2vw, 14px);
  text-transform: uppercase; letter-spacing: 0.03em;
  color: var(--gold); line-height: 1.1;
}
.board-cell {
  background: linear-gradient(180deg, #1f1c2e 0%, #15131f 100%);
  border-radius: 10px; cursor: pointer; border: none;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 900; font-size: clamp(18px, 2.5vw, 34px);
  color: var(--gold); transition: all 0.15s ease;
  padding: 8px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}
.board-cell:hover:not(:disabled) {
  background: linear-gradient(180deg, #2a253d 0%, #1d1a2c 100%);
  color: var(--ink); transform: scale(1.02);
}
.board-cell.used { background: transparent; color: transparent; cursor: default; box-shadow: inset 0 0 0 1px var(--line); }
.board-cell:disabled { cursor: not-allowed; }
.board-cell.has-image::after { content: '📷'; position: absolute; font-size: 12px; }

.player-bar { display: flex; gap: 12px; margin-top: 24px; overflow-x: auto; padding-bottom: 8px; }
.player-chip {
  background: var(--bg-2); border-radius: 14px;
  padding: 12px 16px; min-width: 140px; flex-shrink: 0;
  border: 2px solid var(--line); transition: all 0.2s;
}
.player-chip.current-picker { border-color: var(--gold); box-shadow: 0 0 20px rgba(240,180,41,0.3); }
.player-chip.me { border-color: var(--accent); }
.player-chip-top { display: flex; align-items: center; gap: 8px; }
.player-chip-name { font-weight: 600; font-size: 13px; flex: 1; min-width: 0; }
.player-chip-score {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 900; font-size: 24px;
  color: var(--gold); margin-top: 4px;
}
.player-chip-score.negative { color: var(--accent); }

.picker-banner { text-align: center; margin-bottom: 16px; font-size: 14px; color: var(--ink-dim); }
.picker-banner b { color: var(--gold); }

/* QUESTION VIEW */
.q-stage {
  background: var(--stage); border-radius: 24px;
  padding: 40px 24px; min-height: 60vh;
  display: flex; flex-direction: column;
  box-shadow: 0 24px 48px rgba(0,0,0,0.4);
}
.q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; font-size: 14px; }
.q-cat { text-transform: uppercase; letter-spacing: 0.15em; color: var(--gold); font-weight: 700; }
.q-value { font-family: 'Fraunces', Georgia, serif; font-weight: 900; font-size: 32px; color: var(--gold); }
.q-text { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px 0; flex-direction: column; gap: 16px; }
.q-image { max-width: 100%; max-height: 320px; border-radius: 12px; object-fit: contain; }
.q-text-inner {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 700; font-size: clamp(24px, 4vw, 44px);
  line-height: 1.2; max-width: 900px;
}
.q-answer-reveal {
  margin-top: 24px; padding: 16px;
  background: rgba(74, 222, 128, 0.1);
  border: 1px solid rgba(74, 222, 128, 0.3);
  border-radius: 12px; text-align: center; color: var(--green);
}
.q-answer-reveal-label { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; margin-bottom: 4px; }
.q-answer-reveal-text { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; }

.buzz-btn {
  background: var(--accent); color: var(--ink);
  border: none; border-radius: 100px;
  padding: 24px 48px; cursor: pointer;
  font-family: inherit; font-weight: 700; font-size: 22px;
  width: 100%; max-width: 360px; margin: 0 auto;
  display: block; transition: all 0.15s;
  box-shadow: 0 12px 32px rgba(232,74,48,0.4);
}
.buzz-btn:hover:not(:disabled) {
  background: var(--accent-dark); transform: translateY(-2px);
  box-shadow: 0 16px 40px rgba(232,74,48,0.5);
}
.buzz-btn:active:not(:disabled) { transform: scale(0.97); }
.buzz-btn:disabled { background: var(--soft); cursor: not-allowed; box-shadow: none; opacity: 0.5; }

.buzzed-banner { background: var(--gold); color: var(--bg); border-radius: 16px; padding: 20px 24px; text-align: center; }
.buzzed-banner-label { font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
.buzzed-banner-name { font-family: 'Fraunces', Georgia, serif; font-weight: 900; font-size: 32px; }

.host-controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
.host-controls .btn { flex: 1; min-width: 140px; }
.attempted-list { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
.attempted-chip { background: var(--soft); padding: 4px 10px; border-radius: 999px; font-size: 12px; color: var(--ink-dim); text-decoration: line-through; }

/* SETUP */
.cat-input-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.cat-input-row .num { font-family: 'Fraunces', Georgia, serif; font-weight: 700; color: var(--gold); width: 24px; text-align: center; }
.cat-input-row input { flex: 1; }

.q-builder-card { background: var(--soft); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.q-builder-question { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.q-builder-question .value-pill {
  background: var(--gold); color: var(--bg);
  border-radius: 6px; padding: 4px 8px;
  font-family: 'Fraunces', Georgia, serif; font-weight: 700;
  font-size: 12px; flex-shrink: 0; min-width: 36px; text-align: center;
}
.q-builder-question .q-text-input, .q-builder-question .a-text-input {
  flex: 1; background: transparent; border: none;
  border-bottom: 1px solid var(--line);
  padding: 6px 0; color: var(--ink); outline: none;
  font-family: inherit; font-size: 14px;
}
.q-builder-question .q-text-input:focus, .q-builder-question .a-text-input:focus { border-bottom-color: var(--accent); }
.q-builder-question .a-text-input { color: var(--green); }

.q-image-row { display: flex; align-items: center; gap: 8px; margin-left: 46px; margin-top: 4px; font-size: 12px; }
.q-image-btn { background: var(--soft); border: 1px dashed var(--line); padding: 6px 10px; border-radius: 8px; color: var(--ink-dim); cursor: pointer; font-family: inherit; font-size: 12px; }
.q-image-btn:hover { background: var(--soft-hover); color: var(--ink); }
.q-image-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
.q-image-clear { background: transparent; border: none; color: var(--accent); cursor: pointer; padding: 4px; }

/* FILE UPLOAD */
.dropzone {
  border: 2px dashed var(--line); border-radius: 16px;
  padding: 40px 24px; text-align: center; cursor: pointer;
  transition: all 0.15s; background: var(--soft);
}
.dropzone:hover, .dropzone.drag { border-color: var(--gold); background: rgba(240,180,41,0.05); }
.dropzone-title { font-weight: 700; font-size: 16px; margin-top: 12px; }
.dropzone-sub { color: var(--ink-dim); font-size: 13px; margin-top: 4px; }

.parsed-preview { max-height: 360px; overflow-y: auto; }
.parsed-cat { margin-bottom: 16px; }
.parsed-cat-name { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 18px; color: var(--gold); margin-bottom: 8px; }
.parsed-q { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.parsed-q .v { color: var(--gold); font-weight: 700; }
.parsed-q .a { color: var(--green); font-size: 12px; margin-top: 2px; }

/* SAVED PACKS */
.saved-pack {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-radius: 12px;
  background: var(--soft); margin-bottom: 8px;
  cursor: pointer; transition: background 0.15s;
}
.saved-pack:hover { background: var(--soft-hover); }
.saved-pack-info { flex: 1; min-width: 0; }
.saved-pack-name { font-weight: 600; font-size: 15px; }
.saved-pack-meta { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
.saved-pack-actions { display: flex; gap: 4px; }
.icon-btn { background: transparent; border: none; color: var(--ink-dim); cursor: pointer; padding: 8px; border-radius: 8px; }
.icon-btn:hover { background: var(--soft-hover); color: var(--ink); }
.icon-btn.danger:hover { color: var(--accent); }

/* RESULTS */
.winner-card {
  display: inline-flex; flex-direction: column; align-items: center;
  background: var(--gold); color: var(--bg);
  border-radius: 24px; padding: 32px 48px;
}
.winner-emoji { font-size: 72px; margin-bottom: 8px; }
.winner-name { font-family: 'Fraunces', Georgia, serif; font-size: 40px; font-weight: 900; }
.winner-score { font-size: 14px; opacity: 0.7; margin-top: 4px; font-weight: 700; }
.final-row { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; background: var(--soft); margin-bottom: 8px; }
.final-row.first { background: rgba(240, 180, 41, 0.15); border: 1px solid rgba(240,180,41,0.4); }
.final-row .rank { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; color: var(--ink-faint); width: 32px; }
.final-row .name { flex: 1; font-weight: 500; }
.final-row .pts { font-family: 'Fraunces', Georgia, serif; font-weight: 900; font-size: 22px; color: var(--gold); }
.final-row .pts.negative { color: var(--accent); }

/* SETUP WARNING */
.setup-warning {
  background: rgba(232,74,48,0.1); border: 1px solid rgba(232,74,48,0.4);
  border-radius: 12px; padding: 16px; margin-bottom: 24px;
  color: var(--ink); font-size: 13px; line-height: 1.5;
}
.setup-warning b { color: var(--accent); }
.setup-warning code { background: var(--soft); padding: 1px 6px; border-radius: 4px; font-size: 12px; }

/* FORMAT HINT */
.format-hint {
  background: var(--soft); border-radius: 10px;
  padding: 12px 16px; font-size: 12px;
  color: var(--ink-dim); margin-top: 12px;
  font-family: ui-monospace, 'Cascadia Code', monospace;
  white-space: pre-wrap; line-height: 1.5;
}

/* HOST: clickable score chip */
.player-chip.editable { cursor: pointer; }
.player-chip.editable:hover { background: var(--soft-hover); }
.player-chip.editable .player-chip-score { position: relative; }
.player-chip.editable .player-chip-score::after {
  content: '✏';
  position: absolute; top: -4px; right: -8px;
  font-size: 11px; opacity: 0; transition: opacity 0.15s;
}
.player-chip.editable:hover .player-chip-score::after { opacity: 0.6; }

/* SCORE EDIT MODAL */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  z-index: 100; display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.modal {
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 20px; padding: 24px;
  max-width: 420px; width: 100%;
  animation: slideUp 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.modal-title {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 700; font-size: 22px; margin-bottom: 4px;
}
.modal-subtitle {
  font-size: 13px; color: var(--ink-dim); margin-bottom: 20px;
}
.modal-score {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 900; font-size: 56px;
  color: var(--gold); text-align: center;
  margin: 16px 0;
}
.modal-score.negative { color: var(--accent); }
.score-buttons {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 8px; margin-bottom: 12px;
}
.score-btn {
  background: var(--soft); color: var(--ink);
  border: none; border-radius: 10px; padding: 12px 4px;
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-weight: 700; font-size: 14px;
  cursor: pointer; transition: all 0.15s;
}
.score-btn:hover { background: var(--soft-hover); transform: translateY(-1px); }
.score-btn.minus { color: var(--accent); }
.score-btn.plus { color: var(--green); }
.modal-actions {
  display: flex; gap: 8px; margin-top: 20px;
}
.modal-actions .btn { flex: 1; }

/* TIMER BAR */
.timer-bar {
  margin-bottom: 16px;
  background: var(--soft);
  border-radius: 12px;
  padding: 10px 16px;
}
.timer-bar-label {
  font-size: 13px;
  color: var(--ink-dim);
  margin-bottom: 6px;
  text-align: center;
}
.timer-bar-label b { color: var(--ink); font-size: 16px; font-family: 'Fraunces', Georgia, serif; }
.timer-bar-track {
  height: 6px;
  background: rgba(250, 246, 239, 0.08);
  border-radius: 3px;
  overflow: hidden;
}
.timer-bar-fill {
  height: 100%;
  transition: width 0.25s linear;
